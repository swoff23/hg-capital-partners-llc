<svg xmlns="http://www.w3.org/2000/svg" width="1033" height="730" viewBox="0 0 1033 730">
<title>Telling Pieter when you enter an invoice</title>
<rect width="1033" height="730" fill="#ffffff"/>
<defs><clipPath id="c1"><rect x="0" y="0" width="1280" height="300"/></clipPath><clipPath id="c2"><rect x="0" y="0" width="375" height="300"/></clipPath><clipPath id="c3"><rect x="0" y="0" width="1280" height="300"/></clipPath><clipPath id="c4"><rect x="0" y="0" width="375" height="300"/></clipPath></defs>
<text x="32" y="40" font-family="Geist, -apple-system, system-ui, sans-serif" font-size="18" font-weight="600" fill="#152133">Telling Pieter when you enter an invoice</text>
<text x="32" y="62" font-family="Geist, -apple-system, system-ui, sans-serif" font-size="12" fill="#5b6576">Today an invoice a partner enters sends no email; the other partner sees it only on Home's Needs you row.</text>
<text x="32" y="84" font-family="Geist, -apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#152133">A. Email the other partner</text>
<rect x="232.44800000000004" y="71" width="104" height="18" rx="9" fill="#152133"/>
<text x="284.44800000000004" y="84" font-family="Geist, -apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Recommended</text>
<text x="32" y="104" font-family="Geist, -apple-system, system-ui, sans-serif" font-size="12" fill="#5b6576">When you first save it, Pieter gets the same bundled 'to review' email as for a contractor's invoice; you don't.</text>
<text x="32" y="128" font-family="Geist, -apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#424e61">Laptop 1280</text>
<text x="32" y="143" font-family="Geist, -apple-system, system-ui, sans-serif" font-size="11" fill="#5b6576">Pieter's inbox, after Connor saves a new invoice</text>
<g transform="translate(32.0,152.0) scale(0.55)"><g clip-path="url(#c1)"><rect x="0" y="0" width="1280" height="300" rx="0" fill="#ffffff"/>
<rect x="32" y="24" width="1216" height="230" rx="10" fill="#ffffff" stroke="#e7e5e0" stroke-width="1"/>
<text x="48" y="52" font-size="15" font-weight="600" fill="#152133" text-anchor="start" font-family="Geist, -apple-system, system-ui, sans-serif">1 new invoice to review</text>
<text x="48" y="76" font-size="12" font-weight="400" fill="#5b6576" text-anchor="start" font-family="Geist, -apple-system, system-ui, sans-serif">From HG Capital</text>
<text x="48" y="112" font-size="13" font-weight="400" fill="#152133" text-anchor="start" font-family="Geist, -apple-system, system-ui, sans-serif">Hi Pieter, 1 new invoice came in.</text>
<text x="48" y="138" font-size="13" font-weight="400" fill="#424e61" text-anchor="start" font-family="Geist, -apple-system, system-ui, sans-serif">Dave Kim · $850.00 · entered by Connor</text>
<rect x="48" y="166" width="127.428" height="32" rx="6" fill="#152133"/>
<text x="60.0" y="186.5" font-size="13" font-weight="500" fill="#ffffff" text-anchor="start" font-family="Geist, -apple-system, system-ui, sans-serif">Review invoices</text></g><rect x="0" y="0" width="1280" height="300" fill="none" stroke="#d5d1ca" stroke-width="1.82"/></g>
<text x="776.0" y="128" font-family="Geist, -apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#424e61">Phone 375</text>
<text x="776.0" y="143" font-family="Geist, -apple-system, system-ui, sans-serif" font-size="11" fill="#5b6576">Pieter's inbox, after Connor saves a new invoice</text>
<g transform="translate(776.0,152.0) scale(0.6)"><g clip-path="url(#c2)"><rect x="0" y="0" width="375" height="300" rx="0" fill="#ffffff"/>
<rect x="16" y="24" width="343" height="230" rx="10" fill="#ffffff" stroke="#e7e5e0" stroke-width="1"/>
<text x="32" y="52" font-size="15" font-weight="600" fill="#152133" text-anchor="start" font-family="Geist, -apple-system, system-ui, sans-serif">1 new invoice to review</text>
<text x="32" y="76" font-size="12" font-weight="400" fill="#5b6576" text-anchor="start" font-family="Geist, -apple-system, system-ui, sans-serif">From HG Capital</text>
<text x="32" y="112" font-size="13" font-weight="400" fill="#152133" text-anchor="start" font-family="Geist, -apple-system, system-ui, sans-serif">Hi Pieter, 1 new invoice came in.</text>
<text x="32" y="138" font-size="13" font-weight="400" fill="#424e61" text-anchor="start" font-family="Geist, -apple-system, system-ui, sans-serif">Dave Kim · $850.00 · entered by Connor</text>
<rect x="32" y="166" width="127.428" height="44" rx="6" fill="#152133"/>
<text x="44.0" y="192.5" font-size="13" font-weight="500" fill="#ffffff" text-anchor="start" font-family="Geist, -apple-system, system-ui, sans-serif">Review invoices</text></g><rect x="0" y="0" width="375" height="300" fill="none" stroke="#d5d1ca" stroke-width="1.67"/></g>
<text x="32" y="380.0" font-family="Geist, -apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#152133">B. No email, Home's row only</text>
<text x="32" y="400.0" font-family="Geist, -apple-system, system-ui, sans-serif" font-size="12" fill="#5b6576">As built: it waits in To review and on Home until he opens it.</text>
<text x="32" y="424.0" font-family="Geist, -apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#424e61">Laptop 1280</text>
<text x="32" y="439.0" font-family="Geist, -apple-system, system-ui, sans-serif" font-size="11" fill="#5b6576">Pieter's inbox, after Connor saves a new invoice</text>
<g transform="translate(32.0,448.0) scale(0.55)"><g clip-path="url(#c3)"><rect x="0" y="0" width="1280" height="300" rx="0" fill="#ffffff"/>
<text x="640.0" y="120" font-size="14" font-weight="500" fill="#424e61" text-anchor="middle" font-family="Geist, -apple-system, system-ui, sans-serif">No email.</text>
<text x="640.0" y="144" font-size="13" font-weight="400" fill="#5b6576" text-anchor="middle" font-family="Geist, -apple-system, system-ui, sans-serif">It shows on Home: 1 invoice to review</text></g><rect x="0" y="0" width="1280" height="300" fill="none" stroke="#d5d1ca" stroke-width="1.82"/></g>
<text x="776.0" y="424.0" font-family="Geist, -apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#424e61">Phone 375</text>
<text x="776.0" y="439.0" font-family="Geist, -apple-system, system-ui, sans-serif" font-size="11" fill="#5b6576">Pieter's inbox, after Connor saves a new invoice</text>
<g transform="translate(776.0,448.0) scale(0.6)"><g clip-path="url(#c4)"><rect x="0" y="0" width="375" height="300" rx="0" fill="#ffffff"/>
<text x="187.5" y="120" font-size="14" font-weight="500" fill="#424e61" text-anchor="middle" font-family="Geist, -apple-system, system-ui, sans-serif">No email.</text>
<text x="187.5" y="144" font-size="13" font-weight="400" fill="#5b6576" text-anchor="middle" font-family="Geist, -apple-system, system-ui, sans-serif">It shows on Home: 1 invoice to review</text></g><rect x="0" y="0" width="375" height="300" fill="none" stroke="#d5d1ca" stroke-width="1.67"/></g>
<text x="32" y="676.0" font-family="Geist, -apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#152133">Notes</text>
<circle cx="40" cy="694.0" r="8" fill="#c8a765"/>
<text x="40" y="698.0" font-family="Geist, -apple-system, system-ui, sans-serif" font-size="10" font-weight="600" fill="#152133" text-anchor="middle">1</text>
<text x="56" y="698.0" font-family="Geist, -apple-system, system-ui, sans-serif" font-size="12" fill="#424e61">A: bundled over 10 minutes like the others, so several entries make one email; never sent to the partner who entered it.</text>
</svg>