<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" font-family="Geist, -apple-system, system-ui, sans-serif">
<title>Contractor invoices MVP: in and out</title>
<rect width="1120" height="720" fill="#ffffff"/>
<text x="32" y="40" font-size="16" font-weight="600" fill="#152133">Invoices MVP: send it, Connor loads it, they see where it stands</text>
<text x="32" y="62" font-size="12" fill="#5b6576">No AI reading, no new nav. Everything below the line waits.</text>

<text x="32" y="102" font-size="12" font-weight="600" fill="#424e61">1. Contractor sends it</text>
<rect x="32" y="114" width="300" height="70" rx="8" fill="#f4f5f7" stroke="#d9dde3"/>
<text x="48" y="138" font-size="13" font-weight="500" fill="#152133">Send invoice on the job page</text>
<text x="48" y="156" font-size="11" fill="#5b6576">File (required), invoice #, total (optional)</text>
<text x="48" y="172" font-size="11" fill="#5b6576">Needs a sign-in, not a forwarded job link</text>
<rect x="32" y="194" width="300" height="56" rx="8" fill="#f4f5f7" stroke="#d9dde3"/>
<text x="48" y="218" font-size="13" font-weight="500" fill="#152133">Reply to the job email</text>
<text x="48" y="236" font-size="11" fill="#5b6576">On a done job, the attachment becomes an invoice</text>
<rect x="32" y="260" width="300" height="56" rx="8" fill="#f4f5f7" stroke="#d9dde3"/>
<text x="48" y="284" font-size="13" font-weight="500" fill="#152133">Forward to invoices@</text>
<text x="48" y="302" font-size="11" fill="#5b6576">Contractor or Connor forwards any invoice email</text>

<path d="M340 214 L392 214" stroke="#8a93a3" stroke-width="1.5" fill="none"/>
<path d="M386 209 L394 214 L386 219" stroke="#8a93a3" stroke-width="1.5" fill="none"/>

<text x="404" y="102" font-size="12" font-weight="600" fill="#424e61">2. Connor loads it</text>
<rect x="404" y="114" width="340" height="312" rx="8" fill="#ffffff" stroke="#152133" stroke-width="1.5"/>
<rect x="420" y="130" width="110" height="200" rx="4" fill="#f4f5f7" stroke="#d9dde3"/>
<text x="475" y="226" font-size="11" fill="#5b6576" text-anchor="middle">the invoice</text>
<text x="475" y="242" font-size="11" fill="#5b6576" text-anchor="middle">file</text>
<text x="546" y="144" font-size="11" fill="#5b6576">Contractor</text>
<rect x="546" y="150" width="182" height="22" rx="4" fill="#ffffff" stroke="#d9dde3"/>
<text x="554" y="165" font-size="11" fill="#152133">Zack</text>
<text x="546" y="188" font-size="11" fill="#5b6576">Invoice #</text>
<rect x="546" y="194" width="86" height="22" rx="4" fill="#ffffff" stroke="#d9dde3"/>
<text x="554" y="209" font-size="11" fill="#152133">1043</text>
<text x="642" y="188" font-size="11" fill="#5b6576">Invoice date</text>
<rect x="642" y="194" width="86" height="22" rx="4" fill="#ffffff" stroke="#d9dde3"/>
<text x="650" y="209" font-size="11" fill="#152133">Nov 18</text>
<text x="546" y="232" font-size="11" fill="#5b6576">Total</text>
<rect x="546" y="238" width="182" height="22" rx="4" fill="#ffffff" stroke="#d9dde3"/>
<text x="554" y="253" font-size="11" fill="#152133">$850.00</text>
<text x="546" y="276" font-size="11" fill="#5b6576">Jobs (tack on one or more)</text>
<rect x="546" y="282" width="182" height="22" rx="4" fill="#ffffff" stroke="#d9dde3"/>
<text x="554" y="297" font-size="11" fill="#152133">Fix leak, Unit 2  +</text>
<text x="546" y="320" font-size="11" fill="#5b6576">Note (only you and Pieter)</text>
<rect x="546" y="326" width="182" height="22" rx="4" fill="#ffffff" stroke="#d9dde3"/>
<text x="420" y="350" font-size="11" fill="#9a5b00">Possible duplicate: Zack #1043, paid Nov 3</text>
<text x="420" y="370" font-size="11" fill="#5b6576">History: arrived, approved, paid, by whom</text>
<rect x="420" y="388" width="88" height="24" rx="4" fill="#ffffff" stroke="#d9dde3"/>
<text x="464" y="404" font-size="11" fill="#152133" text-anchor="middle">Not an invoice</text>
<rect x="628" y="388" width="100" height="24" rx="4" fill="#152133"/>
<text x="678" y="404" font-size="11" fill="#ffffff" text-anchor="middle">Approve</text>

<path d="M752 214 L796 214" stroke="#8a93a3" stroke-width="1.5" fill="none"/>
<path d="M790 209 L798 214 L790 219" stroke="#8a93a3" stroke-width="1.5" fill="none"/>

<text x="808" y="102" font-size="12" font-weight="600" fill="#424e61">3. They see where it stands</text>
<rect x="808" y="114" width="280" height="150" rx="8" fill="#f4f5f7" stroke="#d9dde3"/>
<text x="824" y="138" font-size="13" font-weight="500" fill="#152133">On the job page</text>
<rect x="824" y="150" width="248" height="40" rx="6" fill="#ffffff" stroke="#d9dde3"/>
<text x="836" y="174" font-size="12" fill="#152133">#1043 · $850.00</text>
<text x="1060" y="174" font-size="12" fill="#2f6b3a" text-anchor="end">Paid Nov 24</text>
<circle cx="838" cy="214" r="5" fill="#152133"/>
<text x="850" y="218" font-size="11" fill="#152133">Received</text>
<path d="M902 214 L922 214" stroke="#8a93a3"/>
<circle cx="934" cy="214" r="5" fill="#152133"/>
<text x="946" y="218" font-size="11" fill="#152133">Approved</text>
<path d="M1002 214 L1018 214" stroke="#8a93a3"/>
<circle cx="1030" cy="214" r="5" fill="#2f6b3a"/>
<text x="1042" y="218" font-size="11" fill="#2f6b3a">Paid</text>
<text x="824" y="246" font-size="11" fill="#5b6576">Plus a Paid email, under their job email rules</text>
<rect x="808" y="276" width="280" height="150" rx="8" fill="#f4f5f7" stroke="#d9dde3"/>
<text x="824" y="300" font-size="13" font-weight="500" fill="#152133">Your invoices, under My jobs</text>
<text x="824" y="318" font-size="11" fill="#5b6576">Every invoice, with or without a job</text>
<rect x="824" y="330" width="248" height="30" rx="6" fill="#ffffff" stroke="#d9dde3"/>
<text x="836" y="349" font-size="11" fill="#152133">#1043 · $850.00</text>
<text x="1060" y="349" font-size="11" fill="#2f6b3a" text-anchor="end">Paid</text>
<rect x="824" y="366" width="248" height="30" rx="6" fill="#ffffff" stroke="#d9dde3"/>
<text x="836" y="385" font-size="11" fill="#152133">#1051 · $1,200.00</text>
<text x="1060" y="385" font-size="11" fill="#152133" text-anchor="end">Approved</text>

<text x="404" y="460" font-size="12" font-weight="600" fill="#424e61">Connor's Invoices page</text>
<rect x="404" y="472" width="340" height="34" rx="8" fill="#f4f5f7" stroke="#d9dde3"/>
<rect x="408" y="476" width="110" height="26" rx="6" fill="#ffffff" stroke="#152133"/>
<text x="463" y="493" font-size="11" fill="#152133" text-anchor="middle">To review 2</text>
<text x="574" y="493" font-size="11" fill="#5b6576" text-anchor="middle">To pay 5</text>
<text x="684" y="493" font-size="11" fill="#5b6576" text-anchor="middle">Paid</text>
<text x="404" y="528" font-size="11" fill="#5b6576">Mark paid one at a time: date, method, check # or note. Undo.</text>
<text x="32" y="460" font-size="12" font-weight="600" fill="#424e61">How you hear about one</text>
<text x="32" y="484" font-size="11" fill="#5b6576">One email to you and Pieter, bundled</text>
<text x="32" y="502" font-size="11" fill="#5b6576">A Needs you row on Home: "2 invoices to review"</text>
<text x="32" y="520" font-size="11" fill="#5b6576">Each job lists its invoices on its task page</text>

<line x1="32" y1="556" x2="1088" y2="556" stroke="#d9dde3"/>
<text x="32" y="584" font-size="12" font-weight="600" fill="#424e61">Waits until real use shows a need</text>
<text x="32" y="608" font-size="12" fill="#5b6576">Claude reading invoices (no AI key)</text>
<text x="32" y="630" font-size="12" fill="#5b6576">The No invoice list and its chasing</text>
<text x="32" y="652" font-size="12" fill="#5b6576">Pay-by dates and overdue marks</text>
<text x="400" y="608" font-size="12" fill="#5b6576">Mark several paid at once</text>
<text x="400" y="630" font-size="12" fill="#5b6576">Totals, period menu, contractor filter</text>
<text x="400" y="652" font-size="12" fill="#5b6576">Contractor edit, withdraw, Send back</text>
<text x="760" y="608" font-size="12" fill="#5b6576">Deposits, credits, rehab links</text>
<text x="760" y="630" font-size="12" fill="#5b6576">Payment-method tags, W-9 and check flags</text>
<text x="760" y="652" font-size="12" fill="#5b6576">Invoices on the contractor page</text>
<text x="32" y="694" font-size="11" fill="#8a93a3">Kept from the review: the sender check (DMARC) on forwards, safe file serving, money math in cents, totals always positive.</text>
</svg>
