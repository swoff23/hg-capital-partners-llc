<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="700" viewBox="0 0 1140 700" font-family="Geist, -apple-system, system-ui, sans-serif">
<title>The 24-hour notice email</title>
<defs>
  <g id="days">
    <text x="250" y="0" font-size="11" font-weight="500" fill="#5d6778" text-anchor="middle">Tue 17</text>
    <text x="380" y="0" font-size="11" font-weight="500" fill="#5d6778" text-anchor="middle">Wed 18</text>
    <text x="510" y="0" font-size="11" font-weight="500" fill="#5d6778" text-anchor="middle">Thu 19</text>
    <text x="640" y="0" font-size="11" font-weight="500" fill="#5d6778" text-anchor="middle">Fri 20</text>
  </g>
  <g id="grid">
    <line x1="185" y1="0" x2="705" y2="0" stroke="#e7e5e0"/>
    <line x1="315" y1="0" x2="315" y2="80" stroke="#f2f0ec"/>
    <line x1="445" y1="0" x2="445" y2="80" stroke="#f2f0ec"/>
    <line x1="575" y1="0" x2="575" y2="80" stroke="#f2f0ec"/>
  </g>
</defs>
<rect width="1140" height="700" fill="#ffffff"/>
<text x="32" y="40" font-size="17" font-weight="600" fill="#152133">Q6. Someone lives there and Permission to enter is off: when does the heads-up go?</text>
<text x="32" y="62" font-size="12" fill="#5d6778">It goes to the contractor at 8 am, who tells the tenant (the app doesn't email tenants). Every job also gets "Scheduled today" on their day (your Q5).</text>

<!-- ============ A ============ -->
<rect x="16" y="80" width="1108" height="330" rx="12" fill="#ffffff" stroke="#152133" stroke-width="2"/>
<text x="36" y="108" font-size="14" font-weight="600" fill="#152133">A. The day before they go (recommended)</text>
<text x="36" y="126" font-size="11" fill="#5d6778">The day before their scheduled day. With no day picked yet, the day before Due, so they can still make it.</text>

<g transform="translate(0 152)"><use href="#days"/></g>
<g transform="translate(0 162)">
  <use href="#grid"/>
  <text x="36" y="26" font-size="11.5" font-weight="500" fill="#152133">They picked Thu 19</text>
  <text x="36" y="42" font-size="10.5" fill="#5d6778">Due Fri 20</text>
  <rect x="320" y="12" width="120" height="30" rx="6" fill="#152133"/>
  <text x="380" y="32" font-size="10.5" font-weight="500" fill="#ffffff" text-anchor="middle">Scheduled tomorrow</text>
  <text x="380" y="56" font-size="9.5" fill="#a54e09" text-anchor="middle">+ give 24 hours' notice</text>
  <rect x="450" y="12" width="120" height="30" rx="6" fill="#ffffff" stroke="#c9c5bd"/>
  <text x="510" y="32" font-size="10.5" font-weight="500" fill="#152133" text-anchor="middle">Scheduled today</text>
  <rect x="580" y="12" width="120" height="30" rx="6" fill="#ffffff" stroke="#c9c5bd"/>
  <text x="640" y="32" font-size="10.5" font-weight="500" fill="#152133" text-anchor="middle">Due today</text>
  <text x="640" y="56" font-size="9.5" fill="#5d6778" text-anchor="middle">only if still open</text>
</g>
<g transform="translate(0 246)">
  <use href="#grid"/>
  <text x="36" y="26" font-size="11.5" font-weight="500" fill="#152133">No day picked yet</text>
  <text x="36" y="42" font-size="10.5" fill="#5d6778">Due Fri 20</text>
  <rect x="450" y="12" width="120" height="30" rx="6" fill="#152133"/>
  <text x="510" y="32" font-size="10.5" font-weight="500" fill="#ffffff" text-anchor="middle">Due tomorrow</text>
  <text x="510" y="56" font-size="9.5" fill="#a54e09" text-anchor="middle">+ give 24 hours' notice</text>
  <rect x="580" y="12" width="120" height="30" rx="6" fill="#ffffff" stroke="#c9c5bd"/>
  <text x="640" y="32" font-size="10.5" font-weight="500" fill="#152133" text-anchor="middle">Due today</text>
</g>
<text x="36" y="356" font-size="11" fill="#424e61">They pick a day after 8 am the day before (or pick tomorrow): the heads-up goes right away instead.</text>
<text x="36" y="374" font-size="11" fill="#424e61">A vacant unit, or permission on: no heads-up, just "Scheduled today" as every job gets.</text>

<!-- email preview -->
<g transform="translate(736 140)">
  <rect width="368" height="252" rx="10" fill="#ffffff" stroke="#d5d1ca" stroke-width="1.5"/>
  <rect x="0.75" y="0.75" width="366.5" height="40" rx="9" fill="#f8f7f3"/>
  <line x1="1" y1="41" x2="367" y2="41" stroke="#e7e5e0"/>
  <text x="14" y="18" font-size="9.5" fill="#5d6778">HG Capital</text>
  <text x="14" y="33" font-size="10.5" font-weight="600" fill="#152133">Scheduled tomorrow: Fix the kitchen faucet, 1412 Elm St · 2</text>
  <rect x="14" y="56" width="22" height="22" rx="4" fill="#152133"/>
  <text x="25" y="71" font-size="9" font-weight="600" fill="#c8a765" text-anchor="middle">HG</text>
  <text x="14" y="104" font-size="13" font-weight="600" fill="#152133">You're scheduled for tomorrow, Thu, Nov 19</text>
  <rect x="14" y="116" width="340" height="40" rx="6" fill="#fff5ec"/>
  <text x="24" y="133" font-size="10.5" font-weight="500" fill="#a54e09">Tell the tenant today. They need 24 hours' notice,</text>
  <text x="24" y="148" font-size="10.5" font-weight="500" fill="#a54e09">and you don't have permission to let yourself in.</text>
  <rect x="14" y="168" width="110" height="30" rx="6" fill="#152133"/>
  <text x="69" y="188" font-size="10.5" font-weight="500" fill="#ffffff" text-anchor="middle">Text the tenant</text>
  <rect x="132" y="168" width="96" height="30" rx="6" fill="#ffffff" stroke="#c9c5bd"/>
  <text x="180" y="188" font-size="10.5" font-weight="500" fill="#152133" text-anchor="middle">Change day</text>
  <rect x="14" y="214" width="200" height="6" rx="3" fill="#f2f0ec"/>
  <rect x="14" y="228" width="150" height="6" rx="3" fill="#f2f0ec"/>
</g>

<!-- ============ B ============ -->
<rect x="16" y="426" width="1108" height="258" rx="12" fill="#ffffff" stroke="#e7e5e0" stroke-width="1.5"/>
<text x="36" y="454" font-size="14" font-weight="600" fill="#152133">B. The day before your due date, always</text>
<text x="36" y="472" font-size="11" fill="#5d6778">Ignores the day they picked.</text>

<g transform="translate(0 498)"><use href="#days"/></g>
<g transform="translate(0 508)">
  <use href="#grid"/>
  <text x="36" y="26" font-size="11.5" font-weight="500" fill="#152133">They picked Thu 19</text>
  <text x="36" y="42" font-size="10.5" fill="#5d6778">Due Fri 20</text>
  <rect x="450" y="12" width="120" height="30" rx="6" fill="#ffffff" stroke="#b4452b" stroke-width="1.5"/>
  <text x="510" y="32" font-size="10.5" font-weight="500" fill="#152133" text-anchor="middle">Due tomorrow</text>
  <text x="510" y="56" font-size="9.5" fill="#b4452b" text-anchor="middle">lands the morning they go:</text>
  <text x="510" y="69" font-size="9.5" fill="#b4452b" text-anchor="middle">no notice left</text>
  <rect x="580" y="12" width="120" height="30" rx="6" fill="#ffffff" stroke="#c9c5bd"/>
  <text x="640" y="32" font-size="10.5" font-weight="500" fill="#152133" text-anchor="middle">Due today</text>
</g>
<g transform="translate(0 592)">
  <use href="#grid"/>
  <text x="36" y="26" font-size="11.5" font-weight="500" fill="#152133">No day picked yet</text>
  <text x="36" y="42" font-size="10.5" fill="#5d6778">Due Fri 20</text>
  <rect x="450" y="12" width="120" height="30" rx="6" fill="#ffffff" stroke="#c9c5bd"/>
  <text x="510" y="32" font-size="10.5" font-weight="500" fill="#152133" text-anchor="middle">Due tomorrow</text>
  <rect x="580" y="12" width="120" height="30" rx="6" fill="#ffffff" stroke="#c9c5bd"/>
  <text x="640" y="32" font-size="10.5" font-weight="500" fill="#152133" text-anchor="middle">Due today</text>
</g>
<text x="736" y="530" font-size="11" fill="#424e61">Same as A when no day is picked.</text>
<text x="736" y="552" font-size="11" fill="#424e61">Once they pick a day before Due, the</text>
<text x="736" y="568" font-size="11" fill="#424e61">heads-up comes too late for that day.</text>
</svg>
