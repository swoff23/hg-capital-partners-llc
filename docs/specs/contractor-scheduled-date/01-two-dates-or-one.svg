<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Geist, -apple-system, system-ui, sans-serif">
<title>Two dates or one</title>
<rect width="1200" height="640" fill="#ffffff"/>
<text x="32" y="40" font-size="17" font-weight="600" fill="#152133">Q1. Two dates on a job, or one?</text>
<text x="32" y="62" font-size="12" fill="#5d6778">The contractor's job page on a phone (375). Where the date sits is the next question; this one is who owns what.</text>

<!-- ===== Option A ===== -->
<rect x="24" y="84" width="568" height="532" rx="12" fill="#ffffff" stroke="#152133" stroke-width="2"/>
<text x="48" y="114" font-size="14" font-weight="600" fill="#152133">A. Two dates (recommended)</text>
<text x="48" y="134" font-size="11.5" fill="#5d6778">Matches what you asked for. Reverses the Nov 14 "one date, always Due" call.</text>

<g transform="translate(48 152)">
  <rect width="260" height="440" rx="22" fill="#ffffff" stroke="#d5d1ca" stroke-width="1.5"/>
  <text x="16" y="28" font-size="10.5" fill="#5d6778">‹ My jobs</text>
  <rect x="1" y="40" width="258" height="84" fill="#f2f0ec"/>
  <path d="M110 96 L130 78 L150 96 V110 H110 Z" fill="none" stroke="#d5d1ca" stroke-width="2"/>
  <rect x="14" y="138" width="40" height="18" rx="9" fill="#f2f0ec"/>
  <text x="34" y="151" font-size="9.5" font-weight="500" fill="#424e61" text-anchor="middle">To do</text>
  <text x="62" y="151" font-size="10.5" font-weight="500" fill="#424e61">Due</text>
  <text x="84" y="151" font-size="10.5" fill="#5d6778">Thu, Nov 19</text>
  <text x="14" y="178" font-size="14" font-weight="600" fill="#152133">Fix the kitchen faucet</text>
  <text x="14" y="196" font-size="10.5" fill="#5d6778">1412 Elm St, Unit 2</text>
  <line x1="14" y1="214" x2="246" y2="214" stroke="#e7e5e0"/>
  <text x="14" y="238" font-size="11" font-weight="500" fill="#424e61">Scheduled</text>
  <text x="246" y="238" font-size="11" fill="#152133" text-anchor="end">Tue, Nov 17</text>
  <line x1="190" y1="242" x2="246" y2="242" stroke="#152133" stroke-dasharray="1.5 2"/>
  <line x1="14" y1="256" x2="246" y2="256" stroke="#e7e5e0"/>
  <rect x="14" y="276" width="70" height="7" rx="3.5" fill="#e7e5e0"/>
  <rect x="14" y="292" width="200" height="6" rx="3" fill="#f2f0ec"/>
  <rect x="14" y="304" width="160" height="6" rx="3" fill="#f2f0ec"/>
  <rect x="14" y="330" width="70" height="7" rx="3.5" fill="#e7e5e0"/>
  <rect x="14" y="346" width="210" height="6" rx="3" fill="#f2f0ec"/>
  <rect x="14" y="390" width="232" height="34" rx="8" fill="#152133"/>
  <text x="130" y="411" font-size="11" font-weight="500" fill="#ffffff" text-anchor="middle">Start job</text>
</g>

<!-- A callouts -->
<line x1="230" y1="299" x2="330" y2="299" stroke="#5d6778" stroke-dasharray="3 3"/>
<circle cx="230" cy="299" r="3" fill="#5d6778"/>
<text x="338" y="295" font-size="12" font-weight="600" fill="#152133">Due: yours</text>
<text x="338" y="312" font-size="11.5" fill="#424e61">They see it. They can't change it.</text>
<text x="338" y="328" font-size="11.5" fill="#424e61">The late flag and the 8 am email</text>
<text x="338" y="343" font-size="11.5" fill="#424e61">still run off it.</text>

<line x1="302" y1="390" x2="330" y2="390" stroke="#5d6778" stroke-dasharray="3 3"/>
<circle cx="302" cy="390" r="3" fill="#5d6778"/>
<text x="338" y="386" font-size="12" font-weight="600" fill="#152133">Scheduled: theirs</text>
<text x="338" y="403" font-size="11.5" fill="#424e61">The day they plan to go. Tap to set</text>
<text x="338" y="419" font-size="11.5" fill="#424e61">or move it, any day, no approval.</text>
<text x="338" y="435" font-size="11.5" fill="#424e61">You get an email each time:</text>
<text x="338" y="452" font-size="11.5" fill="#152133" font-style="italic">"Zack scheduled it for Tue, Nov 17."</text>

<rect x="338" y="490" width="230" height="96" rx="8" fill="#f8f7f3" stroke="#e7e5e0"/>
<text x="352" y="512" font-size="11" font-weight="600" fill="#152133">Built from what's there</text>
<text x="352" y="530" font-size="11" fill="#424e61">The scheduled date field already exists.</text>
<text x="352" y="546" font-size="11" fill="#424e61">Their Change date writes it instead</text>
<text x="352" y="562" font-size="11" fill="#424e61">of Due. No new date picker.</text>

<!-- ===== Option B ===== -->
<rect x="608" y="84" width="568" height="532" rx="12" fill="#ffffff" stroke="#e7e5e0" stroke-width="1.5"/>
<text x="632" y="114" font-size="14" font-weight="600" fill="#152133">B. One date (today)</text>
<text x="632" y="134" font-size="11.5" fill="#5d6778">What's live since Nov 14. Nothing to build.</text>

<g transform="translate(632 152)">
  <rect width="260" height="440" rx="22" fill="#ffffff" stroke="#d5d1ca" stroke-width="1.5"/>
  <text x="16" y="28" font-size="10.5" fill="#5d6778">‹ My jobs</text>
  <rect x="1" y="40" width="258" height="84" fill="#f2f0ec"/>
  <path d="M110 96 L130 78 L150 96 V110 H110 Z" fill="none" stroke="#d5d1ca" stroke-width="2"/>
  <rect x="14" y="138" width="40" height="18" rx="9" fill="#f2f0ec"/>
  <text x="34" y="151" font-size="9.5" font-weight="500" fill="#424e61" text-anchor="middle">To do</text>
  <text x="62" y="151" font-size="10.5" font-weight="500" fill="#424e61">Due</text>
  <text x="84" y="151" font-size="10.5" fill="#5d6778">Thu, Nov 19</text>
  <line x1="62" y1="155" x2="142" y2="155" stroke="#5d6778" stroke-dasharray="1.5 2"/>
  <text x="14" y="178" font-size="14" font-weight="600" fill="#152133">Fix the kitchen faucet</text>
  <text x="14" y="196" font-size="10.5" fill="#5d6778">1412 Elm St, Unit 2</text>
  <rect x="14" y="230" width="70" height="7" rx="3.5" fill="#e7e5e0"/>
  <rect x="14" y="246" width="200" height="6" rx="3" fill="#f2f0ec"/>
  <rect x="14" y="258" width="160" height="6" rx="3" fill="#f2f0ec"/>
  <rect x="14" y="284" width="70" height="7" rx="3.5" fill="#e7e5e0"/>
  <rect x="14" y="300" width="210" height="6" rx="3" fill="#f2f0ec"/>
  <rect x="14" y="390" width="232" height="34" rx="8" fill="#152133"/>
  <text x="130" y="411" font-size="11" font-weight="500" fill="#ffffff" text-anchor="middle">Start job</text>
</g>

<line x1="776" y1="303" x2="914" y2="303" stroke="#5d6778" stroke-dasharray="3 3"/>
<circle cx="776" cy="303" r="3" fill="#5d6778"/>
<text x="922" y="299" font-size="12" font-weight="600" fill="#152133">Due: both sides</text>
<text x="922" y="316" font-size="11.5" fill="#424e61">Their pick replaces your due date.</text>
<text x="922" y="332" font-size="11.5" fill="#424e61">Your original day is only in the</text>
<text x="922" y="347" font-size="11.5" fill="#424e61">activity log, and late is judged</text>
<text x="922" y="362" font-size="11.5" fill="#424e61">against their day, not yours.</text>
</svg>
