  <text x="14" y="132" font-size="11" font-weight="500" fill="#152133">Patch the hall drywall</text>
  <text x="246" y="132" font-size="10" fill="#424e61" text-anchor="end">Nov 24</text>
  <text x="14" y="150" font-size="9.5" fill="#5d6778">56 Tamarack St</text>
</g>
<text x="432" y="556" font-size="11" fill="#424e61">Your due date drops out of the list for every job they</text>
<text x="432" y="572" font-size="11" fill="#424e61">book. Late goes by Due (Q1), so the chip can show a</text>
<text x="432" y="588" font-size="11" fill="#424e61">past day that isn't red, or turn red on a day it isn't</text>
<text x="432" y="604" font-size="11" fill="#424e61">showing. The chip would move their day, not yours.</text>

<!-- ============ C ============ -->
<rect x="808" y="80" width="376" height="552" rx="12" fill="#ffffff" stroke="#e7e5e0" stroke-width="1.5"/>
<text x="828" y="108" font-size="14" font-weight="600" fill="#152133">C. Two date chips</text>
<text x="828" y="126" font-size="11" fill="#5d6778">Their day and your due date side by side at the end.</text>

