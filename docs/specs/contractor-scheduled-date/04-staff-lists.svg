<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="648" viewBox="0 0 1200 648" font-family="Geist, -apple-system, system-ui, sans-serif">
<title>Both dates in your task lists</title>
<rect width="1200" height="648" fill="#ffffff"/>
<text x="32" y="40" font-size="17" font-weight="600" fill="#152133">Q4. In your task lists, what does a contractor's job show?</text>
<text x="32" y="62" font-size="12" fill="#5d6778">Tasks, Today, the contractor's page and the property's Tasks all use this row. Your task page already has a Due row and a Scheduled row.</text>

<!-- ============ A ============ -->
<rect x="16" y="80" width="376" height="552" rx="12" fill="#ffffff" stroke="#152133" stroke-width="2"/>
<text x="36" y="108" font-size="14" font-weight="600" fill="#152133">A. Day in the status, Due in the chip</text>
<text x="36" y="126" font-size="11" fill="#5d6778">(recommended) Like "Waiting on National Fuel" today.</text>

<text x="32" y="156" font-size="10.5" font-weight="500" fill="#424e61">Laptop 1280</text>
<g transform="translate(32 164)">
  <rect width="344" height="150" rx="8" fill="#ffffff" stroke="#d5d1ca" stroke-width="1.5"/>
  <!-- row 1 -->
  <text x="12" y="24" font-size="10.5" font-weight="500" fill="#152133">Fix the kitchen faucet</text>
  <text x="12" y="38" font-size="9" fill="#5d6778">1412 Elm St · Zack</text>
  <circle cx="170" cy="21" r="4" fill="none" stroke="#5d6778" stroke-width="1.3"/>
  <text x="178" y="24" font-size="9.5" fill="#424e61">Scheduled Tue, Nov 17</text>
  <text x="334" y="24" font-size="9.5" fill="#424e61" text-anchor="end">Nov 19</text>
  <line x1="12" y1="50" x2="332" y2="50" stroke="#e7e5e0"/>
  <!-- row 2 -->
  <text x="12" y="72" font-size="10.5" font-weight="500" fill="#152133">Replace smoke detectors</text>
  <text x="12" y="86" font-size="9" fill="#5d6778">88 Oak Ave · Zack</text>
  <circle cx="170" cy="69" r="4" fill="#5d6778"/>
  <text x="178" y="72" font-size="9.5" fill="#424e61">In progress</text>
  <text x="334" y="72" font-size="9.5" fill="#b4452b" text-anchor="end">Nov 16</text>
  <line x1="12" y1="98" x2="332" y2="98" stroke="#e7e5e0"/>
  <!-- row 3 -->
  <text x="12" y="120" font-size="10.5" font-weight="500" fill="#152133">Patch the hall drywall</text>
  <text x="12" y="134" font-size="9" fill="#5d6778">56 Tamarack St · Luis</text>
  <text x="334" y="120" font-size="9.5" fill="#424e61" text-anchor="end">Nov 24</text>
</g>

<text x="32" y="344" font-size="10.5" font-weight="500" fill="#424e61">Phone 375 (tablet 768 is like the laptop)</text>
<g transform="translate(74 352)">
  <rect width="260" height="168" rx="18" fill="#ffffff" stroke="#d5d1ca" stroke-width="1.5"/>
  <text x="14" y="28" font-size="11" font-weight="500" fill="#152133">Fix the kitchen faucet</text>
  <text x="246" y="28" font-size="10" fill="#424e61" text-anchor="end">Nov 19</text>
  <circle cx="18" cy="43" r="3.5" fill="none" stroke="#5d6778" stroke-width="1.2"/>
  <text x="26" y="46" font-size="9.5" fill="#424e61">Scheduled Tue, Nov 17 · 1412 Elm St</text>
  <line x1="14" y1="58" x2="246" y2="58" stroke="#e7e5e0"/>
  <text x="14" y="80" font-size="11" font-weight="500" fill="#152133">Replace smoke detectors</text>
  <text x="246" y="80" font-size="10" fill="#b4452b" text-anchor="end">Nov 16</text>
  <circle cx="18" cy="95" r="3.5" fill="#5d6778"/>
  <text x="26" y="98" font-size="9.5" fill="#424e61">In progress · 88 Oak Ave</text>
  <line x1="14" y1="110" x2="246" y2="110" stroke="#e7e5e0"/>
  <text x="14" y="132" font-size="11" font-weight="500" fill="#152133">Patch the hall drywall</text>
  <text x="246" y="132" font-size="10" fill="#424e61" text-anchor="end">Nov 24</text>
  <text x="14" y="150" font-size="9.5" fill="#5d6778">56 Tamarack St</text>
</g>
<text x="36" y="556" font-size="11" fill="#424e61">The chip is always your due date, so red always</text>
<text x="36" y="572" font-size="11" fill="#424e61">means late, and you change Due from the chip as now.</text>
<text x="36" y="592" font-size="11" fill="#424e61">Their day rides with the status, the spot you already</text>
<text x="36" y="608" font-size="11" fill="#424e61">skim. At 320 the place drops first, never the day.</text>

<!-- ============ B ============ -->
<rect x="412" y="80" width="376" height="552" rx="12" fill="#ffffff" stroke="#e7e5e0" stroke-width="1.5"/>
<text x="432" y="108" font-size="14" font-weight="600" fill="#152133">B. Their day in the chip, as today</text>
<text x="432" y="126" font-size="11" fill="#5d6778">A Scheduled job's chip shows their day; Due is hidden.</text>

<text x="428" y="156" font-size="10.5" font-weight="500" fill="#424e61">Laptop 1280</text>
