<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Geist, -apple-system, system-ui, sans-serif">
<title>Question 6: the page a resident follows. First the sent screen (same for every option). A (recommended): three steps, Received, Scheduled, Done. B: dated updates, newest first. C: status on the list only, no request page.</title>
<rect width="1000" height="640" fill="#ffffff"/>
<text x="32" y="36" font-size="15" font-weight="600" fill="#152133">Question 6: what does the resident see after Send, and while they wait?</text>
<text x="32" y="56" font-size="11" fill="#424e61">On a phone. The sent screen is the same for every option; A, B and C are the request itself.</text>

<!-- Sent screen -->
<g transform="translate(32 76)">
<rect x="0" y="0" width="224" height="470" rx="10" fill="none" stroke="#d9dde3"/>
<text x="14" y="28" font-size="13" font-weight="600" fill="#152133">After Send</text>
<text x="14" y="44" font-size="10" fill="#424e61">Same for A, B and C</text>
<rect x="14" y="56" width="196" height="300" rx="18" fill="#ffffff" stroke="#152133"/>
<rect x="30" y="74" width="164" height="90" rx="8" fill="#e6e9ee"/>
<text x="112" y="124" font-size="9" fill="#5d6878" text-anchor="middle">their first photo</text>
<text x="30" y="192" font-size="14" font-weight="600" fill="#152133">Thanks, Dana!</text>
<text x="30" y="212" font-size="10" fill="#424e61">We have your request for</text>
<text x="30" y="226" font-size="10" fill="#424e61">"Kitchen sink leaks."</text>
<text x="30" y="248" font-size="10" fill="#424e61">We'll email you when it's</text>
<text x="30" y="262" font-size="10" fill="#424e61">scheduled.</text>
<rect x="30" y="300" width="164" height="32" rx="8" fill="#152133"/>
<text x="112" y="320" font-size="11" font-weight="500" fill="#ffffff" text-anchor="middle">See your request</text>
<text x="14" y="384" font-size="10.5" fill="#152133">• Their photo, a warm heading</text>
<text x="22" y="398" font-size="10.5" fill="#152133">and what happens next.</text>
<text x="14" y="418" font-size="10.5" fill="#152133">• A copy of the request goes to</text>
<text x="22" y="432" font-size="10.5" fill="#152133">their email, like the move-in</text>
<text x="22" y="446" font-size="10.5" fill="#152133">report's copy.</text>
</g>

<!-- A -->
<g transform="translate(268 76)">
<rect x="0" y="0" width="224" height="470" rx="10" fill="none" stroke="#c9a96a" stroke-width="1.5"/>
<text x="14" y="28" font-size="13" font-weight="600" fill="#152133">A. Three steps</text>
<rect x="118" y="15" width="92" height="20" rx="10" fill="#f6efe1"/>
<text x="164" y="29" font-size="10" font-weight="500" fill="#8a6d2f" text-anchor="middle">Recommended</text>
<rect x="14" y="56" width="196" height="300" rx="18" fill="#ffffff" stroke="#152133"/>
<text x="30" y="80" font-size="9.5" fill="#424e61">‹ My requests</text>
<text x="30" y="102" font-size="13" font-weight="600" fill="#152133">Kitchen sink leaks</text>
<text x="30" y="117" font-size="9.5" fill="#424e61">56 Tamarack St, Upper</text>
<circle cx="36" cy="140" r="5" fill="#152133"/>
<text x="48" y="144" font-size="10.5" font-weight="500" fill="#152133">Received</text>
<text x="194" y="144" font-size="9.5" fill="#424e61" text-anchor="end">Fri, Nov 21</text>
<line x1="36" y1="146" x2="36" y2="164" stroke="#152133"/>
<circle cx="36" cy="170" r="5" fill="#152133"/>
<text x="48" y="174" font-size="10.5" font-weight="500" fill="#152133">Scheduled</text>
<text x="194" y="174" font-size="9.5" fill="#424e61" text-anchor="end">Tue, Nov 25</text>
<line x1="36" y1="176" x2="36" y2="194" stroke="#d9dde3"/>
<circle cx="36" cy="200" r="5" fill="#ffffff" stroke="#8f99a8"/>
<text x="48" y="204" font-size="10.5" fill="#8f99a8">Done</text>
<line x1="30" y1="222" x2="194" y2="222" stroke="#eceef1"/>
<text x="30" y="240" font-size="9.5" font-weight="500" fill="#424e61">What you sent</text>
<text x="30" y="256" font-size="9.5" fill="#152133">Water under the sink when</text>
<text x="30" y="269" font-size="9.5" fill="#152133">the dishwasher runs.</text>
<rect x="30" y="280" width="34" height="28" rx="4" fill="#e6e9ee"/>
<rect x="70" y="280" width="34" height="28" rx="4" fill="#e6e9ee"/>
<text x="30" y="328" font-size="9.5" fill="#424e61">Let yourselves in · Pets: a cat</text>
<text x="14" y="384" font-size="10.5" fill="#152133">• Like an order tracker: what's</text>
<text x="22" y="398" font-size="10.5" fill="#152133">next, and when.</text>
<text x="14" y="418" font-size="10.5" fill="#152133">• A new day updates Scheduled.</text>
<text x="14" y="438" font-size="10.5" fill="#152133">• Closed shows your line in</text>
<text x="22" y="452" font-size="10.5" fill="#152133">place of Done.</text>
</g>

<!-- B -->
<g transform="translate(504 76)">
<rect x="0" y="0" width="224" height="470" rx="10" fill="none" stroke="#d9dde3"/>
<text x="14" y="28" font-size="13" font-weight="600" fill="#152133">B. Dated updates</text>
<rect x="14" y="56" width="196" height="300" rx="18" fill="#ffffff" stroke="#152133"/>
<text x="30" y="80" font-size="9.5" fill="#424e61">‹ My requests</text>
<text x="30" y="102" font-size="13" font-weight="600" fill="#152133">Kitchen sink leaks</text>
<text x="30" y="117" font-size="9.5" fill="#424e61">56 Tamarack St, Upper</text>
<text x="30" y="142" font-size="9" fill="#8f99a8">Nov 24</text>
<text x="30" y="156" font-size="10" fill="#152133">Moved to Thu, Nov 27</text>
<line x1="30" y1="166" x2="194" y2="166" stroke="#eceef1"/>
<text x="30" y="182" font-size="9" fill="#8f99a8">Nov 22</text>
<text x="30" y="196" font-size="10" fill="#152133">Scheduled for Tue, Nov 25</text>
<line x1="30" y1="206" x2="194" y2="206" stroke="#eceef1"/>
<text x="30" y="222" font-size="9" fill="#8f99a8">Nov 21</text>
<text x="30" y="236" font-size="10" fill="#152133">We have your request</text>
<line x1="30" y1="248" x2="194" y2="248" stroke="#eceef1"/>
<text x="30" y="266" font-size="9.5" font-weight="500" fill="#424e61">What you sent</text>
<rect x="30" y="276" width="34" height="28" rx="4" fill="#e6e9ee"/>
<rect x="70" y="276" width="34" height="28" rx="4" fill="#e6e9ee"/>
<text x="14" y="384" font-size="10.5" fill="#152133">• Every change as a dated line,</text>
<text x="22" y="398" font-size="10.5" fill="#152133">newest first.</text>
<text x="14" y="418" font-size="10.5" fill="#152133">• Shows when the day moved.</text>
<text x="14" y="438" font-size="10.5" fill="#152133">• More to read for the one thing</text>
<text x="22" y="452" font-size="10.5" fill="#152133">they want: when.</text>
</g>

<!-- C -->
<g transform="translate(740 76)">
<rect x="0" y="0" width="224" height="470" rx="10" fill="none" stroke="#d9dde3"/>
<text x="14" y="28" font-size="13" font-weight="600" fill="#152133">C. Status on the list only</text>
<rect x="14" y="56" width="196" height="300" rx="18" fill="#ffffff" stroke="#152133"/>
<text x="30" y="84" font-size="13" font-weight="600" fill="#152133">Hi Dana</text>
<rect x="30" y="96" width="164" height="30" rx="8" fill="#152133"/>
<text x="112" y="115" font-size="10.5" font-weight="500" fill="#ffffff" text-anchor="middle">Report a problem</text>
<rect x="30" y="138" width="164" height="44" rx="8" fill="#ffffff" stroke="#d9dde3"/>
<text x="40" y="156" font-size="10.5" font-weight="500" fill="#152133">Kitchen sink leaks</text>
<text x="40" y="172" font-size="9.5" fill="#424e61">Scheduled · Tue, Nov 25</text>
<rect x="30" y="190" width="164" height="44" rx="8" fill="#ffffff" stroke="#d9dde3"/>
<text x="40" y="208" font-size="10.5" font-weight="500" fill="#152133">Smoke alarm chirping</text>
<text x="40" y="224" font-size="9.5" fill="#424e61">Done · Oct 30</text>
<text x="112" y="270" font-size="9" fill="#8f99a8" text-anchor="middle">rows don't open</text>
<text x="14" y="384" font-size="10.5" fill="#152133">• Status and day on the list</text>
<text x="22" y="398" font-size="10.5" fill="#152133">they already have. Least to build.</text>
<text x="14" y="418" font-size="10.5" fill="#152133">• Nowhere to see what they sent,</text>
<text x="22" y="432" font-size="10.5" fill="#152133">or your line when you close one.</text>
</g>

<text x="32" y="578" font-size="11" fill="#424e61">What each task status shows: Open, Waiting and In progress show Received. Scheduled shows the day. Review stays Scheduled until you mark it Done.</text>
<text x="32" y="596" font-size="11" fill="#424e61">Done shows Done. Canceled shows Closed with your line. Emails go out on the same changes (decided in question 5).</text>
<text x="32" y="618" font-size="11" fill="#424e61">Sizes: phones (375 and 320) as drawn. Tablet and laptop keep the centered 480 column.</text>
</svg>
