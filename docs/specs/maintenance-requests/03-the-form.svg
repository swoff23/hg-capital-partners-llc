<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" font-family="Geist, -apple-system, system-ui, sans-serif">
<title>Question 3: the request form on a phone. A, one screen (recommended): what's wrong, more detail, photos or video, can we let ourselves in, Send. B, three steps. C, pick a type first, then A's screen.</title>
<rect width="900" height="700" fill="#ffffff"/>
<text x="32" y="36" font-size="15" font-weight="600" fill="#152133">Question 3: what does the form look like?</text>
<text x="32" y="56" font-size="11" fill="#424e61">After Report a problem on their link. They're already known, so no name, address or phone to type.</text>

<!-- A -->
<g transform="translate(32 76)">
<rect x="0" y="0" width="260" height="560" rx="10" fill="none" stroke="#c9a96a" stroke-width="1.5"/>
<text x="20" y="30" font-size="13" font-weight="600" fill="#152133">A. One screen</text>
<rect x="116" y="16" width="92" height="20" rx="10" fill="#f6efe1"/>
<text x="162" y="30" font-size="10" font-weight="500" fill="#8a6d2f" text-anchor="middle">Recommended</text>

<rect x="20" y="48" width="220" height="344" rx="18" fill="#ffffff" stroke="#152133"/>
<text x="36" y="74" font-size="13" font-weight="600" fill="#152133">Report a problem</text>
<text x="36" y="89" font-size="9.5" fill="#424e61">56 Tamarack St, Upper</text>
<text x="36" y="112" font-size="10" font-weight="500" fill="#424e61">What's wrong?</text>
<rect x="36" y="118" width="188" height="28" rx="6" fill="#ffffff" stroke="#d9dde3"/>
<text x="46" y="136" font-size="10" fill="#8f99a8">Kitchen sink leaks</text>
<text x="36" y="164" font-size="10" font-weight="500" fill="#424e61">Tell us more (optional)</text>
<rect x="36" y="170" width="188" height="44" rx="6" fill="#ffffff" stroke="#d9dde3"/>
<text x="36" y="232" font-size="10" font-weight="500" fill="#424e61">Photos or video</text>
<rect x="36" y="238" width="44" height="44" rx="6" fill="#e6e9ee"/>
<rect x="86" y="238" width="44" height="44" rx="6" fill="#e6e9ee"/>
<text x="108" y="264" font-size="9" fill="#5d6878" text-anchor="middle">▶ 0:12</text>
<rect x="136" y="238" width="44" height="44" rx="6" fill="#ffffff" stroke="#d9dde3"/>
<text x="158" y="265" font-size="16" fill="#424e61" text-anchor="middle">+</text>
<text x="36" y="302" font-size="10" font-weight="500" fill="#424e61">Can we let ourselves in?</text>
<rect x="36" y="308" width="88" height="28" rx="6" fill="#ffffff" stroke="#d9dde3"/>
<text x="80" y="326" font-size="10" fill="#152133" text-anchor="middle">Yes</text>
<rect x="130" y="308" width="94" height="28" rx="6" fill="#ffffff" stroke="#d9dde3"/>
<text x="177" y="326" font-size="10" fill="#152133" text-anchor="middle">Call me first</text>
<rect x="36" y="348" width="188" height="32" rx="8" fill="#152133"/>
<text x="130" y="368" font-size="11.5" font-weight="500" fill="#ffffff" text-anchor="middle">Send request</text>

<text x="20" y="418" font-size="10.5" fill="#152133">• One screen, about 30 seconds.</text>
<text x="20" y="438" font-size="10.5" fill="#152133">• The keyboard's mic key turns talking</text>
<text x="28" y="452" font-size="10.5" fill="#152133">into text, at no cost to build.</text>
<text x="20" y="472" font-size="10.5" fill="#152133">• Becomes the task: its title, notes and</text>
<text x="28" y="486" font-size="10.5" fill="#152133">photos. "Yes" turns on Permission to</text>
<text x="28" y="500" font-size="10.5" fill="#152133">enter, so the job shows the lockbox.</text>
<text x="20" y="520" font-size="10.5" fill="#152133">• Send stays pinned above the keyboard.</text>
</g>

<!-- B -->
<g transform="translate(320 76)">
<rect x="0" y="0" width="260" height="560" rx="10" fill="none" stroke="#d9dde3"/>
<text x="20" y="30" font-size="13" font-weight="600" fill="#152133">B. Three steps</text>

<rect x="20" y="48" width="220" height="344" rx="18" fill="#ffffff" stroke="#152133"/>
<text x="36" y="72" font-size="9.5" fill="#424e61">1 of 3</text>
<rect x="36" y="80" width="58" height="4" rx="2" fill="#152133"/>
<rect x="101" y="80" width="58" height="4" rx="2" fill="#d9dde3"/>
<rect x="166" y="80" width="58" height="4" rx="2" fill="#d9dde3"/>
<text x="36" y="112" font-size="14" font-weight="600" fill="#152133">What's wrong?</text>
<rect x="36" y="122" width="188" height="28" rx="6" fill="#ffffff" stroke="#d9dde3"/>
<text x="46" y="140" font-size="10" fill="#8f99a8">Kitchen sink leaks</text>
<rect x="36" y="158" width="188" height="70" rx="6" fill="#ffffff" stroke="#d9dde3"/>
<text x="46" y="176" font-size="10" fill="#8f99a8">Tell us more (optional)</text>
<text x="130" y="270" font-size="9.5" fill="#8f99a8" text-anchor="middle">Next: Photos or video</text>
<text x="130" y="286" font-size="9.5" fill="#8f99a8" text-anchor="middle">Then: Can we let ourselves in?</text>
<rect x="36" y="348" width="188" height="32" rx="8" fill="#152133"/>
<text x="130" y="368" font-size="11.5" font-weight="500" fill="#ffffff" text-anchor="middle">Next</text>

<text x="20" y="418" font-size="10.5" fill="#152133">• What's wrong, then photos, then</text>
<text x="28" y="432" font-size="10.5" fill="#152133">letting us in, then Send.</text>
<text x="20" y="452" font-size="10.5" fill="#152133">• One thing at a time, big and calm.</text>
<text x="20" y="472" font-size="10.5" fill="#152133">• Two more taps for the same answers,</text>
<text x="28" y="486" font-size="10.5" fill="#152133">which feels slow for "sink leaks."</text>
</g>

<!-- C -->
<g transform="translate(608 76)">
<rect x="0" y="0" width="260" height="560" rx="10" fill="none" stroke="#d9dde3"/>
<text x="20" y="30" font-size="13" font-weight="600" fill="#152133">C. Pick a type first</text>

<rect x="20" y="48" width="220" height="344" rx="18" fill="#ffffff" stroke="#152133"/>
<text x="36" y="76" font-size="13" font-weight="600" fill="#152133">What needs fixing?</text>
<rect x="36" y="92" width="90" height="44" rx="8" fill="#ffffff" stroke="#d9dde3"/>
<text x="81" y="118" font-size="10" fill="#152133" text-anchor="middle">Plumbing</text>
<rect x="134" y="92" width="90" height="44" rx="8" fill="#ffffff" stroke="#d9dde3"/>
<text x="179" y="118" font-size="10" fill="#152133" text-anchor="middle">Heat or AC</text>
<rect x="36" y="144" width="90" height="44" rx="8" fill="#ffffff" stroke="#d9dde3"/>
<text x="81" y="170" font-size="10" fill="#152133" text-anchor="middle">Electrical</text>
<rect x="134" y="144" width="90" height="44" rx="8" fill="#ffffff" stroke="#d9dde3"/>
<text x="179" y="170" font-size="10" fill="#152133" text-anchor="middle">Appliance</text>
<rect x="36" y="196" width="90" height="44" rx="8" fill="#ffffff" stroke="#d9dde3"/>
<text x="81" y="222" font-size="10" fill="#152133" text-anchor="middle">Pests</text>
<rect x="134" y="196" width="90" height="44" rx="8" fill="#ffffff" stroke="#d9dde3"/>
<text x="179" y="222" font-size="10" fill="#152133" text-anchor="middle">Something else</text>
<text x="130" y="290" font-size="9.5" fill="#8f99a8" text-anchor="middle">then the same screen as A</text>

<text x="20" y="418" font-size="10.5" fill="#152133">• One tap first, then A's screen.</text>
<text x="20" y="438" font-size="10.5" fill="#152133">• The task arrives tagged with a type,</text>
<text x="28" y="452" font-size="10.5" fill="#152133">a head start on which trade to send.</text>
<text x="20" y="472" font-size="10.5" fill="#152133">• Residents often guess wrong: a stain</text>
<text x="28" y="486" font-size="10.5" fill="#152133">on the ceiling, plumbing or roof?</text>
</g>

<text x="32" y="662" font-size="11" fill="#424e61">Sizes: phones (375 and 320) as drawn, button pinned above the keyboard. Tablet and laptop: same column, centered, about 480 wide.</text>
<text x="32" y="680" font-size="11" fill="#424e61">Emergencies (no heat, water pouring, a gas smell) come in the next question, so they aren't drawn here.</text>
</svg>
