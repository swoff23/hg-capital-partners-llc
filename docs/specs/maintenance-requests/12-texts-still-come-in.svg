<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="Geist, -apple-system, system-ui, sans-serif">
<title>Question 11: a repair still arrives in the group chat. A: log it for them so it shows on their page. B (recommended): reply with their link and they send it themselves. C: make a normal task they never see.</title>
<rect width="1000" height="600" fill="#ffffff"/>
<text x="32" y="36" font-size="15" font-weight="600" fill="#152133">Question 11: a repair still shows up in the group chat. What do you do?</text>
<text x="32" y="56" font-size="11" fill="#424e61">Dana texts the group chat: "the bathroom fan stopped working."</text>

<!-- A -->
<g transform="translate(32 76)">
<rect x="0" y="0" width="300" height="440" rx="10" fill="none" stroke="#d9dde3"/>
<text x="20" y="30" font-size="13" font-weight="600" fill="#152133">A. Log it for them</text>
<rect x="20" y="48" width="260" height="200" rx="10" fill="#ffffff" stroke="#152133"/>
<text x="36" y="72" font-size="9" fill="#8f99a8">Dana's sheet on the lease page</text>
<rect x="36" y="82" width="228" height="30" rx="6" fill="#ffffff" stroke="#d9dde3"/>
<text x="150" y="101" font-size="10.5" fill="#152133" text-anchor="middle">Log a request for Dana</text>
<text x="36" y="136" font-size="10" fill="#424e61">Opens the resident form for you.</text>
<text x="36" y="160" font-size="9" fill="#8f99a8">Then on Dana's page:</text>
<rect x="36" y="168" width="228" height="44" rx="8" fill="#ffffff" stroke="#d9dde3"/>
<text x="46" y="186" font-size="10.5" font-weight="500" fill="#152133">Bathroom fan stopped</text>
<text x="46" y="202" font-size="9.5" fill="#424e61">Received · logged by Connor</text>
<text x="20" y="276" font-size="10.5" fill="#152133">• It's tracked and Dana gets the updates.</text>
<text x="20" y="296" font-size="10.5" fill="#152133">• Texting keeps working for them, so the</text>
<text x="28" y="310" font-size="10.5" fill="#152133">habit you want to break stays.</text>
<text x="20" y="330" font-size="10.5" fill="#152133">• You type what they could have.</text>
</g>

<!-- B -->
<g transform="translate(350 76)">
<rect x="0" y="0" width="300" height="440" rx="10" fill="none" stroke="#c9a96a" stroke-width="1.5"/>
<text x="20" y="30" font-size="13" font-weight="600" fill="#152133">B. Reply with their link</text>
<rect x="188" y="16" width="92" height="20" rx="10" fill="#f6efe1"/>
<text x="234" y="30" font-size="10" font-weight="500" fill="#8a6d2f" text-anchor="middle">Recommended</text>
<rect x="20" y="48" width="260" height="200" rx="10" fill="#ffffff" stroke="#152133"/>
<text x="36" y="72" font-size="9" fill="#8f99a8">The group chat</text>
<rect x="36" y="80" width="170" height="26" rx="12" fill="#eceef1"/>
<text x="48" y="97" font-size="10" fill="#152133">the bathroom fan stopped</text>
<rect x="74" y="116" width="190" height="56" rx="12" fill="#152133"/>
<text x="86" y="134" font-size="10" fill="#ffffff">Can you send it through your</text>
<text x="86" y="148" font-size="10" fill="#ffffff">link so we can track it?</text>
<text x="86" y="162" font-size="10" fill="#ffffff" text-decoration="underline">hgcapitalpartners.com/r/7Kq</text>
<text x="36" y="200" font-size="9.5" fill="#424e61">Copy link from the tenant sheet (question 10).</text>
<text x="20" y="276" font-size="10.5" fill="#152133">• Teaches the rule every time it's broken.</text>
<text x="20" y="296" font-size="10.5" fill="#152133">• Nothing new to build: Copy link exists.</text>
<text x="20" y="316" font-size="10.5" fill="#152133">• Their photos and the let-us-in answer</text>
<text x="28" y="330" font-size="10.5" fill="#152133">come with it.</text>
<text x="20" y="350" font-size="10.5" fill="#152133">• Log it for them (A) can come later if</text>
<text x="28" y="364" font-size="10.5" fill="#152133">someone just won't.</text>
</g>

<!-- C -->
<g transform="translate(668 76)">
<rect x="0" y="0" width="300" height="440" rx="10" fill="none" stroke="#d9dde3"/>
<text x="20" y="30" font-size="13" font-weight="600" fill="#152133">C. Make a normal task</text>
<rect x="20" y="48" width="260" height="200" rx="10" fill="#ffffff" stroke="#152133"/>
<text x="36" y="72" font-size="9" fill="#8f99a8">New task, as today</text>
<text x="36" y="98" font-size="10.5" font-weight="500" fill="#152133">Bathroom fan stopped</text>
<text x="36" y="114" font-size="9.5" fill="#424e61">56 Tamarack St · Upper</text>
<text x="36" y="160" font-size="9" fill="#8f99a8">Dana's page:</text>
<text x="36" y="178" font-size="10" fill="#424e61">doesn't show it, no emails</text>
<text x="20" y="276" font-size="10.5" fill="#152133">• Fastest for you in the moment.</text>
<text x="20" y="296" font-size="10.5" fill="#152133">• Dana can't follow it, so texts again</text>
<text x="28" y="310" font-size="10.5" fill="#152133">to ask when.</text>
</g>

<text x="32" y="556" font-size="11" fill="#424e61">Either way, you can still make a normal task for anything: work you find yourself, or a repair a resident never needs to follow.</text>
<text x="32" y="574" font-size="11" fill="#424e61">Sizes: Copy link lives in the tenant sheet on every screen; on a phone you paste it straight into Messages.</text>
</svg>
