</g>
<text x="32" y="900" font-size="11" fill="#5b6576">The Done circles stay. While picking, a tap anywhere on a row picks it,</text>
<text x="32" y="916" font-size="11" fill="#5b6576">its date and person included. Touch has no hover, so no faint check.</text>

