</g>

<g font-size="11" fill="#5b6576">
<text x="32" y="506">Hover a row and its box shows in the left margin, in the unread dot's place. Once one is picked, every row and heading shows its box.</text>
<text x="32" y="522">The header box picks every row on screen, a heading's box picks that building, Shift-click picks a range. A click elsewhere on a row still opens it.</text>
</g>

