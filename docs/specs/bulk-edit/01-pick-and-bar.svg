<svg xmlns="http://www.w3.org/2000/svg" width="900" height="920" viewBox="0 0 900 920" font-family="Geist, -apple-system, system-ui, sans-serif">
<title>Picking task rows and the bulk edit bar at laptop 1280, tablet 768, phone 375 and phone 320</title>
<rect width="900" height="920" fill="#ffffff"/>
