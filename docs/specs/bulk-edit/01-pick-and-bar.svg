<svg xmlns="http://www.w3.org/2000/svg" width="900" height="930" viewBox="0 0 900 930" font-family="Geist, -apple-system, system-ui, sans-serif">
<title>Picking task rows without boxes (Cmd-click, Shift-click, long-press) and the bulk edit bar, at laptop 1280, tablet 768, phone 375 and phone 320</title>
<rect width="900" height="930" fill="#ffffff"/>
<text x="32" y="36" font-size="15" font-weight="600" fill="#152133">Picking rows (no boxes), and the bar that edits them</text>

<!-- Laptop 1280 -->
<text x="32" y="64" font-size="11" font-weight="500" fill="#424e61">Laptop 1280 (mouse): Cmd-click adds a row, Shift-click adds every row between</text>
<rect x="32" y="74" width="836" height="420" rx="12" fill="#ffffff" stroke="#e7e5e0"/>
<text x="72" y="110" font-size="18" font-weight="600" fill="#152133">Tasks</text>
<rect x="640" y="90" width="104" height="28" rx="6" fill="#ffffff"/>
<text x="692" y="108" font-size="12" text-anchor="middle" fill="#152133" text-decoration="underline">Select all 42</text>
<rect x="752" y="90" width="96" height="28" rx="6" fill="#152133"/>
<text x="800" y="108" font-size="12" text-anchor="middle" fill="#ffffff">+ New task</text>
<rect x="72" y="130" width="180" height="28" rx="6" fill="#ffffff" stroke="#e7e5e0"/>
<text x="86" y="148" font-size="11" fill="#8a919c">Search tasks</text>
<rect x="262" y="130" width="120" height="28" rx="6" fill="#f2f0ec"/>
<rect x="265" y="133" width="40" height="22" rx="5" fill="#ffffff" stroke="#84817a"/>
<text x="285" y="148" font-size="11" text-anchor="middle" fill="#152133">Open</text>
<text x="326" y="148" font-size="11" text-anchor="middle" fill="#424e61">Done</text>
<text x="362" y="148" font-size="11" text-anchor="middle" fill="#424e61">All</text>
<rect x="392" y="130" width="84" height="28" rx="6" fill="#ffffff" stroke="#e7e5e0"/><text x="434" y="148" font-size="11" text-anchor="middle" fill="#424e61">+ Assignee</text>
<rect x="484" y="130" width="84" height="28" rx="6" fill="#ffffff" stroke="#e7e5e0"/><text x="526" y="148" font-size="11" text-anchor="middle" fill="#424e61">+ Property</text>

<text x="520" y="182" font-size="11" fill="#5b6576">Property</text>
<text x="650" y="182" font-size="11" fill="#5b6576">Unit</text>
<text x="718" y="182" font-size="11" fill="#5b6576">Assignee</text>
<text x="848" y="182" font-size="11" text-anchor="end" fill="#5b6576">Due</text>
<line x1="72" y1="192" x2="848" y2="192" stroke="#e7e5e0"/>

<!-- group 1, all picked: Deselect -->
<text x="72" y="216" font-size="13" font-weight="600" fill="#152133">767 Prospect Avenue</text>
<text x="210" y="216" font-size="13" fill="#5b6576">3</text>
<text x="848" y="216" font-size="12" text-anchor="end" fill="#152133" text-decoration="underline">Deselect</text>
<line x1="72" y1="226" x2="848" y2="226" stroke="#e7e5e0"/>

<g font-size="12">
<rect x="64" y="228" width="792" height="32" rx="6" fill="#e4e9f0"/>
<rect x="64" y="236" width="2" height="16" fill="#152133"/>
<circle cx="80" cy="244" r="7" fill="none" stroke="#84817a" stroke-width="1.5"/>
<text x="96" y="248" fill="#152133">Mud Drywall</text>
<text x="520" y="248" font-size="11" fill="#5b6576">767 Prospect Avenue</text>
<circle cx="726" cy="244" r="9" fill="#ffffff" stroke="#e7e5e0"/><text x="726" y="247" font-size="7" text-anchor="middle" fill="#424e61">JA</text><text x="740" y="248" font-size="11" fill="#5b6576">Jose</text>
<rect x="794" y="233" width="54" height="22" rx="6" fill="#ffffff" stroke="#e7e5e0"/><text x="821" y="248" font-size="11" text-anchor="middle" fill="#b91c1c">Aug 28</text>

<rect x="64" y="262" width="792" height="32" rx="6" fill="#e4e9f0"/>
<rect x="64" y="270" width="2" height="16" fill="#152133"/>
<circle cx="80" cy="278" r="7" fill="none" stroke="#84817a" stroke-width="1.5"/>
<text x="96" y="282" fill="#152133">finish electric</text>
<text x="520" y="282" font-size="11" fill="#5b6576">767 Prospect Avenue</text>
<circle cx="726" cy="278" r="9" fill="#ffffff" stroke="#e7e5e0"/><text x="726" y="281" font-size="7" text-anchor="middle" fill="#424e61">JH</text><text x="740" y="282" font-size="11" fill="#5b6576">Jake</text>
<rect x="794" y="267" width="54" height="22" rx="6" fill="#ffffff" stroke="#e7e5e0"/><text x="821" y="282" font-size="11" text-anchor="middle" fill="#b91c1c">Nov 6</text>

<rect x="64" y="296" width="792" height="32" rx="6" fill="#e4e9f0"/>
<rect x="64" y="304" width="2" height="16" fill="#152133"/>
<circle cx="80" cy="312" r="7" fill="none" stroke="#84817a" stroke-width="1.5"/>
<text x="96" y="316" fill="#152133">Move water box lower to avoid freezing</text>
<text x="520" y="316" font-size="11" fill="#5b6576">767 Prospect Avenue</text>
<circle cx="726" cy="312" r="9" fill="#ffffff" stroke="#e7e5e0"/><text x="726" y="315" font-size="7" text-anchor="middle" fill="#424e61">IF</text><text x="740" y="316" font-size="11" fill="#5b6576">Idrius</text>
<rect x="794" y="301" width="54" height="22" rx="6" fill="#ffffff" stroke="#e7e5e0"/><text x="821" y="316" font-size="11" text-anchor="middle" fill="#b91c1c">Nov 6</text>
</g>

<!-- group 2, none picked: Select -->
<text x="72" y="356" font-size="13" font-weight="600" fill="#152133">118 Congress St.</text>
<text x="186" y="356" font-size="13" fill="#5b6576">3</text>
<text x="848" y="356" font-size="12" text-anchor="end" fill="#152133" text-decoration="underline">Select</text>
<line x1="72" y1="366" x2="848" y2="366" stroke="#e7e5e0"/>
<g font-size="12">
<!-- hovered row: the Done circle shows its faint check -->
<rect x="64" y="368" width="792" height="32" rx="6" fill="#f2f0ec"/>
<circle cx="80" cy="384" r="7" fill="#eff9f1" stroke="#1d7038" stroke-width="1.5"/>
<path d="M76.6 384.2 79 386.6 83.4 381.8" fill="none" stroke="#1d7038" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="96" y="388" fill="#152133">SCHEDULE Steve's HVAC work for rear unit</text>
<text x="520" y="388" font-size="11" fill="#5b6576">118 Congress St.</text>
<text x="650" y="388" font-size="11" fill="#5b6576">Rear</text>
<circle cx="726" cy="384" r="9" fill="#ffffff" stroke="#e7e5e0"/><text x="726" y="387" font-size="7" text-anchor="middle" fill="#424e61">PL</text><text x="740" y="388" font-size="11" fill="#5b6576">Pieter</text>
<rect x="794" y="373" width="54" height="22" rx="6" fill="#ffffff" stroke="#e7e5e0"/><text x="821" y="388" font-size="11" text-anchor="middle" fill="#b91c1c">Nov 6</text>
</g>

<!-- the bar -->
<path d="M33 436 H867 V482 a12 12 0 0 1 -12 12 H45 a12 12 0 0 1 -12 -12 Z" fill="#f8f7f3"/>
<line x1="33" y1="436" x2="867" y2="436" stroke="#e7e5e0"/>
<text x="72" y="469" font-size="12" font-weight="500" fill="#152133">3 selected</text>
<g font-size="12" fill="#152133">
<rect x="150" y="450" width="78" height="30" rx="6" fill="#ffffff" stroke="#e7e5e0"/>
<circle cx="166" cy="465" r="5.5" fill="none" stroke="#424e61" stroke-width="1.3" stroke-dasharray="2.2 1.8"/><text x="178" y="469">Status</text>
<rect x="236" y="450" width="94" height="30" rx="6" fill="#ffffff" stroke="#e7e5e0"/>
<circle cx="252" cy="462" r="2.6" fill="none" stroke="#424e61" stroke-width="1.3"/><path d="M247 470 a5 4 0 0 1 10 0" fill="none" stroke="#424e61" stroke-width="1.3"/><text x="264" y="469">Assignee</text>
<rect x="338" y="450" width="94" height="30" rx="6" fill="#ffffff" stroke="#e7e5e0"/>
<rect x="348" y="459" width="11" height="11" rx="2" fill="none" stroke="#424e61" stroke-width="1.3"/><line x1="348" y1="463" x2="359" y2="463" stroke="#424e61" stroke-width="1.3"/><text x="366" y="469">Due date</text>
<rect x="440" y="450" width="94" height="30" rx="6" fill="#ffffff" stroke="#e7e5e0"/>
<rect x="451" y="458" width="9" height="13" rx="1" fill="none" stroke="#424e61" stroke-width="1.3"/><text x="468" y="469">Property</text>
<rect x="542" y="450" width="82" height="30" rx="6" fill="#ffffff" stroke="#e7e5e0"/>
<path d="M553 460 h10 M555.5 460 v-1.5 h5 v1.5 M554.5 460 l1 10 h5 l1 -10" fill="none" stroke="#b91c1c" stroke-width="1.3"/><text x="570" y="469" fill="#b91c1c">Delete</text>
<rect x="772" y="450" width="76" height="30" rx="6" fill="#ffffff"/>
<path d="M784 461 l7 7 M791 461 l-7 7" stroke="#424e61" stroke-width="1.3"/><text x="798" y="469">Clear</text>
</g>

<g font-size="11" fill="#5b6576">
<text x="32" y="516">A picked row: the --select fill and a 2px ink notch at its left edge. A plain click still opens the task; middle-click or right-click opens a new tab.</text>
<text x="32" y="532">While picking, each heading ends with Select or Deselect, and Select all sits beside New task. Hovering a Done circle shows a faint green check.</text>
</g>

