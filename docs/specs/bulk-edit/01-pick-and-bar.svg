<text x="48" y="856" font-weight="500">3 selected</text>
<rect x="114" y="834" width="56" height="36" rx="6" fill="#ffffff" stroke="#e7e5e0"/><text x="142" y="856" text-anchor="middle">Status</text>
<rect x="174" y="834" width="62" height="36" rx="6" fill="#ffffff" stroke="#e7e5e0"/><text x="205" y="856" text-anchor="middle">Assignee</text>
<rect x="240" y="834" width="62" height="36" rx="6" fill="#ffffff" stroke="#e7e5e0"/><text x="271" y="856" text-anchor="middle">Due date</text>
<rect x="306" y="834" width="62" height="36" rx="6" fill="#ffffff" stroke="#e7e5e0"/><text x="337" y="856" text-anchor="middle">Property</text>
