<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" font-family="Geist, -apple-system, system-ui, sans-serif">
<title>The contractor's job page: occupied, occupied with permission to enter, and vacant</title>
<rect width="840" height="560" fill="#ffffff"/>
<text x="32" y="36" font-size="15" font-weight="600" fill="#152133">The contractor's job page, phone 375</text>

<g transform="translate(32 56)">
<text x="0" y="12" font-size="11" font-weight="500" fill="#424e61">Occupied (Tenant only)</text>
<rect x="0" y="22" width="240" height="340" rx="18" fill="#ffffff" stroke="#d5d1ca"/>
<rect x="1" y="23" width="238" height="30" rx="17" fill="#f8f7f3"/>
<rect x="16" y="66" width="150" height="9" rx="4" fill="#152133" opacity="0.85"/>
<rect x="16" y="82" width="110" height="6" rx="3" fill="#d5d1ca"/>
<text x="16" y="116" font-size="11" fill="#424e61">Tenant</text>
<line x1="16" y1="122" x2="224" y2="122" stroke="#e7e5e0"/>
<text x="16" y="140" font-size="12"><tspan fill="#152133">Tenant name</tspan><tspan fill="#424e61"> · 716-555-0142</tspan></text>
<rect x="16" y="150" width="100" height="32" rx="8" fill="#ffffff" stroke="#d5d1ca"/>
<text x="66" y="170" font-size="12" fill="#152133" text-anchor="middle">Call</text>
<rect x="124" y="150" width="100" height="32" rx="8" fill="#ffffff" stroke="#d5d1ca"/>
<text x="174" y="170" font-size="12" fill="#152133" text-anchor="middle">Text</text>
<text x="16" y="214" font-size="11" fill="#424e61">Notes</text>
<line x1="16" y1="220" x2="224" y2="220" stroke="#e7e5e0"/>
<rect x="16" y="230" width="190" height="6" rx="3" fill="#e7e5e0"/>
<rect x="16" y="242" width="150" height="6" rx="3" fill="#e7e5e0"/>
<text x="0" y="384" font-size="11" fill="#5b6576">No Lockbox section. They set a time</text>
<text x="0" y="399" font-size="11" fill="#5b6576">with the tenant.</text>
</g>

<g transform="translate(300 56)">
<text x="0" y="12" font-size="11" font-weight="500" fill="#424e61">Occupied, Permission to enter</text>
<rect x="0" y="22" width="240" height="340" rx="18" fill="#ffffff" stroke="#d5d1ca"/>
<rect x="1" y="23" width="238" height="30" rx="17" fill="#f8f7f3"/>
<rect x="16" y="66" width="150" height="9" rx="4" fill="#152133" opacity="0.85"/>
<rect x="16" y="82" width="110" height="6" rx="3" fill="#d5d1ca"/>
<text x="16" y="116" font-size="11" fill="#424e61">Tenant</text>
<line x1="16" y1="122" x2="224" y2="122" stroke="#e7e5e0"/>
<text x="16" y="140" font-size="12"><tspan fill="#152133">Tenant name</tspan><tspan fill="#424e61"> · 716-555-0142</tspan></text>
<rect x="16" y="150" width="100" height="32" rx="8" fill="#ffffff" stroke="#d5d1ca"/>
<text x="66" y="170" font-size="12" fill="#152133" text-anchor="middle">Call</text>
<rect x="124" y="150" width="100" height="32" rx="8" fill="#ffffff" stroke="#d5d1ca"/>
<text x="174" y="170" font-size="12" fill="#152133" text-anchor="middle">Text</text>
<text x="16" y="214" font-size="11" fill="#424e61">Lockbox</text>
<line x1="16" y1="220" x2="224" y2="220" stroke="#e7e5e0"/>
<text x="16" y="242" font-size="17" font-family="Geist Mono, ui-monospace, monospace" fill="#152133">4521</text>
<text x="16" y="262" font-size="11" fill="#1d7038">The tenant said you can let yourself in</text>
<text x="16" y="294" font-size="11" fill="#424e61">Notes</text>
<line x1="16" y1="300" x2="224" y2="300" stroke="#e7e5e0"/>
<rect x="16" y="310" width="190" height="6" rx="3" fill="#e7e5e0"/>
<text x="0" y="384" font-size="11" fill="#5b6576">Tenant first, then Lockbox with the</text>
<text x="0" y="399" font-size="11" fill="#5b6576">permission line under the code.</text>
</g>

<g transform="translate(568 56)">
<text x="0" y="12" font-size="11" font-weight="500" fill="#424e61">Vacant</text>
<rect x="0" y="22" width="240" height="340" rx="18" fill="#ffffff" stroke="#d5d1ca"/>
<rect x="1" y="23" width="238" height="30" rx="17" fill="#f8f7f3"/>
<rect x="16" y="66" width="150" height="9" rx="4" fill="#152133" opacity="0.85"/>
<rect x="16" y="82" width="110" height="6" rx="3" fill="#d5d1ca"/>
<text x="16" y="116" font-size="11" fill="#424e61">Lockbox</text>
<line x1="16" y1="122" x2="224" y2="122" stroke="#e7e5e0"/>
<text x="16" y="144" font-size="17" font-family="Geist Mono, ui-monospace, monospace" fill="#152133">4521</text>
<text x="16" y="182" font-size="11" fill="#424e61">Notes</text>
<line x1="16" y1="188" x2="224" y2="188" stroke="#e7e5e0"/>
<rect x="16" y="198" width="190" height="6" rx="3" fill="#e7e5e0"/>
<rect x="16" y="210" width="150" height="6" rx="3" fill="#e7e5e0"/>
<text x="0" y="384" font-size="11" fill="#5b6576">The page as it is today. A tenant who</text>
<text x="0" y="399" font-size="11" fill="#5b6576">hasn't moved in, or has moved out, never shows.</text>
</g>

<g font-size="11" fill="#424e61">
<text x="32" y="490">Phone 320: Call and Text keep half the row each; a long name truncates before the number.</text>
<text x="32" y="506">Tablet 768: both buttons size to their labels at 44px and sit left.</text>
<text x="32" y="522">Laptop 1280: Call sizes to its label; Text hides with a mouse, so the number stays in full on the line above.</text>
<text x="32" y="538">Closed job, or access removed: neither section.</text>
</g>
</svg>
