<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="560" viewBox="0 0 840 560" font-family="Geist, -apple-system, system-ui, sans-serif">
<title>The contractor's job page: two tenants, one tenant with permission to enter, and vacant</title>
<defs>
<g id="call"><rect x="-14" y="-14" width="28" height="28" rx="7" fill="#ffffff" stroke="#d5d1ca"/><path d="M-5 -5 q0 10 10 10 l2-3-3-2-2 1 q-3-1-4-4 l1-2-2-3z" fill="none" stroke="#424e61" stroke-width="1.2" stroke-linejoin="round"/></g>
<g id="text"><rect x="-14" y="-14" width="28" height="28" rx="7" fill="#ffffff" stroke="#d5d1ca"/><path d="M-6 -5 h12 v8 h-7 l-3 3 v-3 h-2z" fill="none" stroke="#424e61" stroke-width="1.2" stroke-linejoin="round"/></g>
</defs>
<rect width="840" height="560" fill="#ffffff"/>
<text x="32" y="36" font-size="15" font-weight="600" fill="#152133">The contractor's job page, phone 375</text>

<g transform="translate(32 56)">
<text x="0" y="12" font-size="11" font-weight="500" fill="#424e61">Occupied by two, Tenant only</text>
<rect x="0" y="22" width="240" height="340" rx="18" fill="#ffffff" stroke="#d5d1ca"/>
<rect x="1" y="23" width="238" height="30" rx="17" fill="#f8f7f3"/>
<rect x="16" y="66" width="150" height="9" rx="4" fill="#152133" opacity="0.85"/>
<rect x="16" y="82" width="110" height="6" rx="3" fill="#d5d1ca"/>
<text x="16" y="116" font-size="11" fill="#424e61">Tenants</text>
<line x1="16" y1="122" x2="224" y2="122" stroke="#e7e5e0"/>
<text x="16" y="141" font-size="12" fill="#152133">Tenant one</text>
<text x="16" y="156" font-size="11" fill="#424e61">716-555-0142</text>
<use xlink:href="#call" x="174" y="145"/><use xlink:href="#text" x="208" y="145"/>
<line x1="16" y1="168" x2="224" y2="168" stroke="#e7e5e0"/>
<text x="16" y="187" font-size="12" fill="#152133">Tenant two</text>
<text x="16" y="202" font-size="11" fill="#424e61">716-555-0199</text>
<use xlink:href="#call" x="174" y="191"/><use xlink:href="#text" x="208" y="191"/>
<text x="16" y="240" font-size="11" fill="#424e61">Notes</text>
<line x1="16" y1="246" x2="224" y2="246" stroke="#e7e5e0"/>
<rect x="16" y="256" width="190" height="6" rx="3" fill="#e7e5e0"/>
<rect x="16" y="268" width="150" height="6" rx="3" fill="#e7e5e0"/>
<text x="0" y="384" font-size="11" fill="#5b6576">Every tenant, one row each. No Lockbox</text>
<text x="0" y="399" font-size="11" fill="#5b6576">section: they set a time with the tenants.</text>
</g>

<g transform="translate(300 56)">
<text x="0" y="12" font-size="11" font-weight="500" fill="#424e61">Occupied by one, Permission to enter</text>
<rect x="0" y="22" width="240" height="340" rx="18" fill="#ffffff" stroke="#d5d1ca"/>
<rect x="1" y="23" width="238" height="30" rx="17" fill="#f8f7f3"/>
<rect x="16" y="66" width="150" height="9" rx="4" fill="#152133" opacity="0.85"/>
<rect x="16" y="82" width="110" height="6" rx="3" fill="#d5d1ca"/>
<text x="16" y="116" font-size="11" fill="#424e61">Tenant</text>
<line x1="16" y1="122" x2="224" y2="122" stroke="#e7e5e0"/>
<text x="16" y="141" font-size="12" fill="#152133">Tenant name</text>
<text x="16" y="156" font-size="11" fill="#424e61">716-555-0142</text>
<use xlink:href="#call" x="174" y="145"/><use xlink:href="#text" x="208" y="145"/>
<text x="16" y="194" font-size="11" fill="#424e61">Lockbox</text>
<line x1="16" y1="200" x2="224" y2="200" stroke="#e7e5e0"/>
<text x="16" y="222" font-size="17" font-family="Geist Mono, ui-monospace, monospace" fill="#152133">4521</text>
<text x="16" y="242" font-size="11" fill="#1d7038">The tenant said you can let yourself in</text>
<text x="16" y="274" font-size="11" fill="#424e61">Notes</text>
<line x1="16" y1="280" x2="224" y2="280" stroke="#e7e5e0"/>
<rect x="16" y="290" width="190" height="6" rx="3" fill="#e7e5e0"/>
<text x="0" y="384" font-size="11" fill="#5b6576">One tenant gets the same row. Lockbox</text>
<text x="0" y="399" font-size="11" fill="#5b6576">follows, with the permission line.</text>
</g>

<g transform="translate(568 56)">
<text x="0" y="12" font-size="11" font-weight="500" fill="#424e61">Vacant</text>
<rect x="0" y="22" width="240" height="340" rx="18" fill="#ffffff" stroke="#d5d1ca"/>
<rect x="1" y="23" width="238" height="30" rx="17" fill="#f8f7f3"/>
<rect x="16" y="66" width="150" height="9" rx="4" fill="#152133" opacity="0.85"/>
<rect x="16" y="82" width="110" height="6" rx="3" fill="#d5d1ca"/>
<text x="16" y="116" font-size="11" fill="#424e61">Lockbox</text>
<line x1="16" y1="122" x2="224" y2="122" stroke="#e7e5e0"/>
<text x="16" y="144" font-size="17" font-family="Geist Mono, ui-monospace, monospace" fill="#152133">4521</text>
<text x="16" y="182" font-size="11" fill="#424e61">Notes</text>
<line x1="16" y1="188" x2="224" y2="188" stroke="#e7e5e0"/>
<rect x="16" y="198" width="190" height="6" rx="3" fill="#e7e5e0"/>
<rect x="16" y="210" width="150" height="6" rx="3" fill="#e7e5e0"/>
<text x="0" y="384" font-size="11" fill="#5b6576">The page as it is today. Tenants who</text>
<text x="0" y="399" font-size="11" fill="#5b6576">haven't moved in, or have moved out, never show.</text>
</g>

<g font-size="11" fill="#424e61">
<text x="32" y="490">Phone 375 and tablet 768 (touch): both icons on every row, 44px square.</text>
<text x="32" y="506">Phone 320: the icons keep their size; a long name truncates before the number does.</text>
<text x="32" y="522">Laptop 1280 with a mouse: the text icon is left out, so each row has the call icon and the number in full.</text>
<text x="32" y="538">Closed job, or access removed: neither section.</text>
</g>
</svg>
