<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="560" viewBox="0 0 880 560" font-family="Geist, -apple-system, system-ui, sans-serif">
<title>The property's Units editor: the unit sheet with several tenants, and the units list</title>
<defs>
<g id="x"><path d="M-4 -4 l8 8 M4 -4 l-8 8" stroke="#424e61" stroke-width="1.3" fill="none"/></g>
</defs>
<rect width="880" height="560" fill="#ffffff"/>
<text x="32" y="36" font-size="15" font-weight="600" fill="#152133">Units and access: the unit sheet and the list</text>

<g transform="translate(32 56)">
<text x="0" y="12" font-size="11" font-weight="500" fill="#424e61">Laptop 1280 and tablet 768, the 672px dialog</text>
<rect x="0" y="22" width="520" height="420" rx="14" fill="#ffffff" stroke="#d5d1ca"/>
<text x="24" y="56" font-size="14" font-weight="600" fill="#152133">Unit 2</text>
<g font-size="11" fill="#424e61">
<text x="24" y="84">Name</text><text x="262" y="84">Lockbox</text>
<text x="24" y="140">Tenant</text><text x="262" y="140">Tenant phone</text>
</g>
<g fill="#ffffff" stroke="#84817a">
<rect x="24" y="90" width="222" height="30" rx="7"/><rect x="262" y="90" width="222" height="30" rx="7"/>
<rect x="24" y="146" width="222" height="30" rx="7"/><rect x="262" y="146" width="194" height="30" rx="7"/>
<rect x="24" y="184" width="222" height="30" rx="7"/><rect x="262" y="184" width="194" height="30" rx="7"/>
<rect x="24" y="270" width="222" height="30" rx="7"/><rect x="262" y="270" width="222" height="30" rx="7"/>
</g>
<g font-size="12" fill="#152133">
<text x="34" y="110">Unit 2</text><text x="272" y="110">At the side door, 4521</text>
<text x="34" y="166">Tenant one</text><text x="272" y="166">716-555-0142</text>
<text x="34" y="204">Tenant two</text><text x="272" y="204">716-555-0199</text>
<text x="34" y="290">Mar 1, 2024</text><text x="272" y="290">Jan 31</text>
</g>
<use xlink:href="#x" x="472" y="161"/><use xlink:href="#x" x="472" y="199"/>
<text x="24" y="236" font-size="12" fill="#424e61">Add another tenant</text>
<g font-size="11" fill="#424e61"><text x="24" y="264">Moves in (optional)</text><text x="262" y="264">Moves out (optional)</text></g>
<text x="262" y="316" font-size="11" fill="#5b6576">Leave blank until they give notice</text>
<text x="24" y="344" font-size="12" fill="#424e61">Remove tenants</text>
<line x1="24" y1="362" x2="496" y2="362" stroke="#e7e5e0"/>
<text x="24" y="386" font-size="12" fill="#424e61">Add next tenants</text>
<rect x="306" y="400" width="88" height="28" rx="7" fill="#ffffff" stroke="#d5d1ca"/>
<text x="350" y="418" font-size="12" fill="#152133" text-anchor="middle">Cancel</text>
<rect x="404" y="400" width="88" height="28" rx="7" fill="#152133"/>
<text x="448" y="418" font-size="12" fill="#ffffff" text-anchor="middle">Save</text>
<text x="0" y="466" font-size="11" fill="#5b6576">Each person: a name and a number, with an X to remove them (up to six). Dates once for the household.</text>
<text x="0" y="481" font-size="11" fill="#5b6576">Add next tenants opens a Next tenants group built the same way, with Moves in required.</text>
<text x="0" y="496" font-size="11" fill="#5b6576">House-meter rows get no tenant fields.</text>
</g>

<g transform="translate(588 56)">
<text x="0" y="12" font-size="11" font-weight="500" fill="#424e61">Phone 375 and 320, full height, stacked</text>
<rect x="0" y="22" width="200" height="238" rx="16" fill="#ffffff" stroke="#d5d1ca"/>
<g font-size="11" fill="#424e61"><text x="14" y="52">Tenant</text><text x="14" y="100">Tenant phone</text><text x="14" y="160">Tenant</text><text x="14" y="208">Tenant phone</text></g>
<g fill="#ffffff" stroke="#84817a"><rect x="14" y="58" width="140" height="28" rx="7"/><rect x="14" y="106" width="172" height="28" rx="7"/><rect x="14" y="166" width="140" height="28" rx="7"/><rect x="14" y="214" width="172" height="28" rx="7"/></g>
<g font-size="12" fill="#152133"><text x="24" y="77">Tenant one</text><text x="24" y="125">716-555-0142</text><text x="24" y="185">Tenant two</text><text x="24" y="233">716-555-0199</text></g>
<use xlink:href="#x" x="172" y="72"/><use xlink:href="#x" x="172" y="180"/>
<line x1="14" y1="148" x2="186" y2="148" stroke="#f2f0ec"/>

<text x="0" y="292" font-size="11" font-weight="500" fill="#424e61">The units list, any size</text>
<rect x="0" y="302" width="270" height="150" rx="12" fill="#ffffff" stroke="#e7e5e0"/>
<text x="16" y="326" font-size="12" fill="#152133">Unit 2</text>
<text x="16" y="343" font-size="11" fill="#5b6576">Tenants Tenant one, Tenant two · moves…</text>
<text x="16" y="358" font-size="11" fill="#5b6576">Next Tenant three · from Feb 1</text>
<text x="16" y="373" font-size="11" fill="#5b6576">Lockbox at the side door</text>
<line x1="16" y1="386" x2="254" y2="386" stroke="#f2f0ec"/>
<text x="16" y="408" font-size="12" fill="#152133">Unit 3</text>
<text x="16" y="428" font-size="12" fill="#424e61">Add tenant</text>
<text x="0" y="474" font-size="11" fill="#5b6576">Names truncate; below 480 the words</text>
<text x="0" y="489" font-size="11" fill="#5b6576">Tenants and Next drop, as Lockbox does.</text>
</g>
</svg>
