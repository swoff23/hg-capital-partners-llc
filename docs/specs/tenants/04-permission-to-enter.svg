<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640">
<title>Permission to enter: the toggle on New task and in the task page's Details</title>
<style>
text{font-family:Geist,-apple-system,"Segoe UI",system-ui,sans-serif}
.h{font-size:17px;font-weight:600;fill:#152133}
.b{font-size:14px;fill:#152133}
.b16{font-size:16px;fill:#152133}
.l{font-size:12px;font-weight:500;fill:#424e61}
.c{font-size:12px;font-weight:500;fill:#152133}
.c13{font-size:13px;font-weight:500;fill:#152133}
.m{font-size:12px;fill:#5b6576}
.m13{font-size:13px;fill:#5b6576}
.cap{font-size:15px;font-weight:600;fill:#152133}
.sub{font-size:12px;fill:#5b6576}
.chip{fill:#ffffff;stroke:#d5d1ca}
.box{fill:#ffffff;stroke:#d5d1ca}
.btn{fill:#152133}
.btnt{font-size:14px;font-weight:500;fill:#ffffff;text-anchor:middle}
.code{font-family:"Geist Mono",ui-monospace,monospace;font-size:14px;font-weight:500;fill:#152133}
.tag{font-size:11px;fill:#424e61}
</style>
<defs>
  <clipPath id="row375"><rect x="0" y="300" width="375" height="60"/></clipPath>
  <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
</defs>
<rect width="1440" height="640" fill="#f8f7f3"/>

<!-- New task, laptop and tablet -->
<text x="24" y="36" class="cap">New task · laptop 1280 and tablet 768</text>
<text x="24" y="56" class="sub">Under the options, only once the picked unit has tenants living there. Off by default.</text>
<rect x="24" y="72" width="672" height="384" rx="12" fill="#ffffff" stroke="#e7e5e0"/>
<text x="48" y="108" class="h">New task</text>
