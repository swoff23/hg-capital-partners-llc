  <path d="M0 592 H375" stroke="#e7e5e0"/>
  <rect x="16" y="623" width="32" height="18" rx="9" fill="#ffffff" stroke="#d5d1ca"/><circle cx="25" cy="632" r="6" fill="#d5d1ca"/>
  <text x="58" y="637" class="m13">Create more</text>
  <rect x="219" y="610" width="140" height="44" rx="6" class="btn"/>
