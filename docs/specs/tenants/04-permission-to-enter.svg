<rect x="56" y="297" width="18" height="18" rx="4" fill="#e7e5e0"/><text x="61" y="310" font-size="10" font-weight="600" fill="#424e61">Z</text>
<text x="82" y="310" class="c">Zack</text>
<rect x="140" y="290" width="62" height="32" rx="6" class="chip"/>
<rect x="150" y="300" width="11" height="11" rx="2" fill="none" stroke="#424e61" stroke-width="1.2"/><path d="M150 304 h11" stroke="#424e61" stroke-width="1.2"/>
<text x="168" y="310" class="c">Fri</text>
<rect x="210" y="290" width="70" height="32" rx="6" class="chip"/>
<circle cx="223" cy="306" r="4.5" fill="none" stroke="#5b6576" stroke-width="1.3"/>
