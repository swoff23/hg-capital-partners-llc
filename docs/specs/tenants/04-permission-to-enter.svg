<rect x="288" y="290" width="204" height="32" rx="6" class="chip"/>
<rect x="295" y="297" width="18" height="18" rx="3" fill="#e7e5e0"/>
<text x="320" y="310" class="c">118 Congress St. · Unit 2</text>
<!-- the toggle -->
<text x="48" y="355" class="b">Permission to enter</text>
<rect x="640" y="342" width="32" height="18" rx="9" fill="#ffffff" stroke="#d5d1ca"/>
<circle cx="649" cy="351" r="6" fill="#d5d1ca"/>
<path d="M24 384 H696" stroke="#e7e5e0"/>
<rect x="48" y="410" width="32" height="18" rx="9" fill="#ffffff" stroke="#d5d1ca"/><circle cx="57" cy="419" r="6" fill="#d5d1ca"/>
<text x="90" y="424" class="m13">Create more</text>
<rect x="560" y="402" width="112" height="36" rx="6" class="btn"/>
