<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="Geist, -apple-system, system-ui, sans-serif">
<title>Settings, Claude tab: both partners with Connect or Disconnect, the Connect steps, and the approval screen Claude opens, at laptop 1280, tablet 768 and phone 375</title>
<rect width="900" height="600" fill="#ffffff"/>
<text x="32" y="36" font-size="15" font-weight="600" fill="#152133">Settings › Claude: who's connected, how to connect, and the approval screen</text>

<g transform="translate(32 56)">
<text x="0" y="12" font-size="11" font-weight="500" fill="#424e61">Laptop 1280 and tablet 768</text>
<rect x="0" y="22" width="560" height="480" rx="12" fill="#ffffff" stroke="#e7e5e0"/>
<text x="20" y="58" font-size="20" font-weight="600" fill="#152133">Settings</text>
<g font-size="12" fill="#5b6576">
<text x="20" y="90">CapEx rules</text><text x="112" y="90">Move-in form</text><text x="214" y="90">Storage</text><text x="280" y="90" fill="#152133">Claude</text>
</g>
<line x1="20" y1="100" x2="540" y2="100" stroke="#e7e5e0"/>
<line x1="280" y1="100" x2="318" y2="100" stroke="#152133" stroke-width="2"/>

<g font-size="12" fill="#152133">
<text x="20" y="134">Connor</text>
<text x="150" y="134" fill="#5b6576">Connected Nov 20 · Used today</text>
<rect x="456" y="118" width="84" height="26" rx="6" fill="#ffffff" stroke="#c9c6bf"/><text x="498" y="135" text-anchor="middle">Disconnect</text>
<line x1="20" y1="152" x2="540" y2="152" stroke="#e7e5e0"/>
<text x="20" y="178">Pieter</text>
<text x="150" y="178" fill="#8a909b">Not connected</text>
<rect x="468" y="162" width="72" height="26" rx="6" fill="#152133"/><text x="504" y="179" text-anchor="middle" fill="#ffffff" font-weight="500">Connect</text>
<line x1="20" y1="196" x2="540" y2="196" stroke="#e7e5e0"/>
</g>
<text x="20" y="220" font-size="11" fill="#5b6576">Connect shows only on your own row, with your own address. Either partner can disconnect the other.</text>

<rect x="80" y="246" width="400" height="232" rx="12" fill="#ffffff" stroke="#c9c6bf"/>
<text x="100" y="278" font-size="15" font-weight="600" fill="#152133">Connect Claude</text>
<g font-size="12" fill="#152133">
<text x="100" y="308">1. Copy your address.</text>
<rect x="100" y="318" width="290" height="30" rx="6" fill="#f7f6f3" stroke="#e7e5e0"/>
<text x="110" y="338" font-family="ui-monospace, monospace" font-size="10">https://www.hgcapitalpartners.com/api/mcp/…</text>
<rect x="398" y="318" width="62" height="30" rx="6" fill="#ffffff" stroke="#c9c6bf"/><text x="429" y="338" text-anchor="middle">Copy</text>
<text x="100" y="374" font-size="11.5">2. In Claude, open Customize, Connectors, Add custom connector.</text>
<text x="100" y="396" font-size="11.5">3. Name it HG Capital, paste the address, then Continue and Add.</text>
<text x="100" y="418" font-size="11.5">4. Tap Connect, then Allow.</text>
</g>
<rect x="398" y="434" width="62" height="28" rx="8" fill="#ffffff" stroke="#c9c6bf"/><text x="429" y="452" font-size="12" fill="#152133" text-anchor="middle">Done</text>
</g>

<g transform="translate(624 56)">
<text x="0" y="12" font-size="11" font-weight="500" fill="#424e61">Phone 375: the approval screen</text>
<rect x="0" y="22" width="244" height="480" rx="16" fill="#ffffff" stroke="#e7e5e0"/>
<circle cx="98" cy="64" r="16" fill="#f7f6f3" stroke="#e7e5e0"/><text x="98" y="68" font-size="10" fill="#152133" text-anchor="middle">AI</text>
<line x1="118" y1="64" x2="126" y2="64" stroke="#c9c6bf"/>
<circle cx="146" cy="64" r="16" fill="#152133"/><text x="146" y="68" font-size="10" fill="#ffffff" text-anchor="middle">HG</text>
<text x="122" y="108" font-size="15" font-weight="600" fill="#152133" text-anchor="middle">Let Claude draft tasks</text>
<text x="122" y="128" font-size="15" font-weight="600" fill="#152133" text-anchor="middle">for you, Pieter?</text>

<g font-size="12">
<text x="20" y="162" fill="#5b6576">Claude can see</text>
<text x="20" y="180" fill="#152133">Properties, units and tenant names.</text>
<text x="20" y="196" fill="#152133">Partners and contractors, with</text>
<text x="20" y="212" fill="#152133">trades, phones and emails.</text>
<text x="20" y="240" fill="#5b6576">Claude can</text>
<text x="20" y="258" fill="#152133">Save draft tasks for you to review.</text>
<text x="20" y="286" fill="#5b6576">Claude can't</text>
<text x="20" y="304" fill="#152133">Add, change or close a task.</text>
<text x="20" y="320" fill="#152133">See lockbox codes or money.</text>
</g>
<rect x="20" y="346" width="98" height="36" rx="8" fill="#ffffff" stroke="#c9c6bf"/><text x="69" y="368" font-size="13" fill="#152133" text-anchor="middle">Cancel</text>
<rect x="126" y="346" width="98" height="36" rx="8" fill="#152133"/><text x="175" y="368" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle">Allow</text>
<text x="20" y="410" font-size="11" fill="#5b6576">Signed out? It asks for your</text>
<text x="20" y="426" font-size="11" fill="#5b6576">HG Capital password first.</text>
<text x="20" y="454" font-size="11" fill="#5b6576">Laptop and tablet: the same card,</text>
<text x="20" y="470" font-size="11" fill="#5b6576">centered at 28rem.</text>
</g>

<text x="32" y="580" font-size="11" fill="#5b6576">Phone, Settings tab: tabs scroll sideways, each partner is two lines (name, then state), and the Connect steps open as a bottom sheet.</text>
</svg>
