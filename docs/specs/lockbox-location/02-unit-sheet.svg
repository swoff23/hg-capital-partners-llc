<rect x="16" y="290" width="14" height="14" rx="3" fill="#152133"/>
<path d="M19.5 297 l2.5 2.5 4.5 -5" fill="none" stroke="#ffffff" stroke-width="1.5"/>
<text x="38" y="301" font-size="11" fill="#152133">Same lockbox for all units</text>
<text x="38" y="317" font-size="9" fill="#a54e09">Replaces the codes on Lower and Upper</text>
<text x="16" y="346" font-size="9" fill="#5b6576">Nothing changes until Save unit.</text>
</g>
</svg>
