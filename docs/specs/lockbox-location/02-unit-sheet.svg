<text x="106" y="197" font-size="11" font-family="Geist Mono, ui-monospace, monospace" fill="#152133">4857</text>
<text x="98" y="228" font-size="10" fill="#424e61">Location</text>
<rect x="98" y="234" width="126" height="42" rx="6" fill="#ffffff" stroke="#c0bdb7"/>
