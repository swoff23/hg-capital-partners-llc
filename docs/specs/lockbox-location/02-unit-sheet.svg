<rect x="16" y="160" width="72" height="116" rx="6" fill="#ffffff" stroke="#84817a" stroke-dasharray="4 3"/>
<rect x="44" y="204" width="16" height="12" rx="2" fill="none" stroke="#5b6576" stroke-width="1.2"/>
<circle cx="52" cy="210" r="3" fill="none" stroke="#5b6576" stroke-width="1.1"/>
<text x="52" y="232" font-size="9" fill="#5b6576" text-anchor="middle">Add photo</text>
<text x="98" y="172" font-size="10" fill="#424e61">Code</text>
