<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="Geist, -apple-system, system-ui, sans-serif">
<title>A lease page's warning lines with Snooze and Dismiss, at laptop 1280, tablet 768 and phone 375</title>
<rect width="900" height="600" fill="#ffffff"/>
<text x="32" y="36" font-size="15" font-weight="600" fill="#152133">The lease page: Snooze and Dismiss at the end of each warning line</text>

<g transform="translate(32 56)">
<text x="0" y="12" font-size="11" font-weight="500" fill="#424e61">Laptop 1280 and tablet 768</text>
<rect x="0" y="22" width="560" height="500" rx="12" fill="#ffffff" stroke="#e7e5e0"/>
<text x="20" y="44" font-size="11" fill="#5b6576">← Tenants / Current</text>
<text x="20" y="70" font-size="18" font-weight="600" fill="#152133">415 Crescent Ave. · Unit 5</text>

<rect x="20" y="84" width="520" height="30" rx="6" fill="#ffffff" stroke="#e7e5e0"/>
<circle cx="35" cy="99" r="5" fill="none" stroke="#9a6700" stroke-width="1.5"/>
<text x="48" y="103" font-size="12" fill="#152133">1 missing: Signed lease PDF</text>
<text x="472" y="103" font-size="11" text-anchor="end" fill="#152133" text-decoration="underline">Snooze</text>
<text x="528" y="103" font-size="11" text-anchor="end" fill="#152133" text-decoration="underline">Dismiss</text>

<rect x="300" y="118" width="200" height="118" rx="8" fill="#ffffff" stroke="#c9c6bf"/>
<g font-size="12" fill="#152133">
<text x="314" y="140">Tomorrow</text><text x="488" y="140" text-anchor="end" fill="#8a909b">Nov 17</text>
<text x="314" y="166">Next week</text><text x="488" y="166" text-anchor="end" fill="#8a909b">Nov 23</text>
<text x="314" y="192">Next month</text><text x="488" y="192" text-anchor="end" fill="#8a909b">Dec 16</text>
<line x1="308" y1="203" x2="492" y2="203" stroke="#e7e5e0"/>
<text x="314" y="224">Pick a date</text>
</g>
<text x="20" y="140" font-size="11" fill="#5b6576">Snooze opens the four picks,</text>
<text x="20" y="155" font-size="11" fill="#5b6576">each with its date. Pick a date</text>
<text x="20" y="170" font-size="11" fill="#5b6576">swaps the menu to a calendar.</text>

<rect x="20" y="250" width="520" height="30" rx="6" fill="#ffffff" stroke="#e7e5e0"/>
<rect x="30" y="259" width="11" height="11" rx="2" fill="none" stroke="#b42318" stroke-width="1.5"/>
<text x="48" y="269" font-size="12" fill="#152133">Lease ends Dec 31 · <tspan fill="#b42318">Notice was due Nov 1</tspan></text>
<text x="472" y="269" font-size="11" text-anchor="end" fill="#152133" text-decoration="underline">Snooze</text>
<text x="528" y="269" font-size="11" text-anchor="end" fill="#152133" text-decoration="underline">Dismiss</text>

<text x="20" y="312" font-size="11" font-weight="500" fill="#424e61">With two gaps, Dismiss (or Snooze) asks which first</text>
<rect x="20" y="320" width="520" height="30" rx="6" fill="#ffffff" stroke="#e7e5e0"/>
<circle cx="35" cy="335" r="5" fill="none" stroke="#9a6700" stroke-width="1.5"/>
<text x="48" y="339" font-size="12" fill="#152133">2 missing: Signed lease PDF, primary tenant's phone</text>
<text x="472" y="339" font-size="11" text-anchor="end" fill="#152133" text-decoration="underline">Snooze</text>
<text x="528" y="339" font-size="11" text-anchor="end" fill="#152133" text-decoration="underline">Dismiss</text>
<rect x="330" y="354" width="200" height="62" rx="8" fill="#ffffff" stroke="#c9c6bf"/>
<g font-size="12" fill="#152133">
<text x="344" y="376">Signed lease PDF</text><text x="518" y="376" text-anchor="end" fill="#8a909b">›</text>
<text x="344" y="402">Primary tenant's phone</text><text x="518" y="402" text-anchor="end" fill="#8a909b">›</text>
</g>
<text x="20" y="376" font-size="11" fill="#5b6576">Picking one dismisses it, or for Snooze,</text>
<text x="20" y="391" font-size="11" fill="#5b6576">moves to the four picks with a back chevron.</text>

<rect x="140" y="462" width="280" height="36" rx="8" fill="#152133"/>
<text x="156" y="484" font-size="12" fill="#ffffff">Signed lease PDF dismissed</text>
<text x="404" y="484" font-size="12" text-anchor="end" fill="#ffffff" text-decoration="underline">Undo</text>
<text x="280" y="514" font-size="11" text-anchor="middle" fill="#5b6576">The line leaves the page. Settings › Hidden keeps it.</text>
</g>

<g transform="translate(624 56)">
<text x="0" y="12" font-size="11" font-weight="500" fill="#424e61">Phone 375</text>
<rect x="0" y="22" width="244" height="500" rx="20" fill="#ffffff" stroke="#e7e5e0"/>
<text x="14" y="50" font-size="11" fill="#5b6576">← Tenants</text>
<text x="14" y="76" font-size="15" font-weight="600" fill="#152133">415 Crescent Ave.</text>
<text x="14" y="94" font-size="15" font-weight="600" fill="#152133">Unit 5</text>

<rect x="12" y="108" width="220" height="34" rx="6" fill="#ffffff" stroke="#e7e5e0"/>
<circle cx="26" cy="125" r="5" fill="none" stroke="#9a6700" stroke-width="1.5"/>
<text x="38" y="129" font-size="11" fill="#152133">1 missing</text>
<text x="170" y="129" font-size="11" text-anchor="end" fill="#152133" text-decoration="underline">Snooze</text>
<text x="224" y="129" font-size="11" text-anchor="end" fill="#152133" text-decoration="underline">Dismiss</text>

<rect x="12" y="150" width="220" height="34" rx="6" fill="#ffffff" stroke="#e7e5e0"/>
<rect x="21" y="161" width="11" height="11" rx="2" fill="none" stroke="#b42318" stroke-width="1.5"/>
<text x="38" y="171" font-size="11" fill="#152133">Lease ends Dec 31</text>
<text x="170" y="171" font-size="11" text-anchor="end" fill="#152133" text-decoration="underline">Snooze</text>
<text x="224" y="171" font-size="11" text-anchor="end" fill="#152133" text-decoration="underline">Dismiss</text>

<rect x="40" y="190" width="192" height="168" rx="8" fill="#ffffff" stroke="#c9c6bf"/>
<g font-size="12" fill="#152133">
<text x="54" y="220">Tomorrow</text><text x="220" y="220" text-anchor="end" fill="#8a909b">Nov 17</text>
<text x="54" y="258">Next week</text><text x="220" y="258" text-anchor="end" fill="#8a909b">Nov 23</text>
<text x="54" y="296">Next month</text><text x="220" y="296" text-anchor="end" fill="#8a909b">Dec 16</text>
<text x="54" y="334">Pick a date</text>
</g>
<text x="14" y="388" font-size="11" fill="#5b6576">The words truncate first; Snooze and</text>
<text x="14" y="403" font-size="11" fill="#5b6576">Dismiss keep 44px targets and never</text>
<text x="14" y="418" font-size="11" fill="#5b6576">wrap. The menu stays anchored, with</text>
<text x="14" y="433" font-size="11" fill="#5b6576">44px rows. Below 480 the missing</text>
<text x="14" y="448" font-size="11" fill="#5b6576">line reads "1 missing" alone.</text>
</g>
</svg>
