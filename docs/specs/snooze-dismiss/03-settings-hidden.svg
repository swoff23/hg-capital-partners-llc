<text x="14" y="126" font-size="13" font-weight="600" fill="#152133">Dismissed</text>
<g font-size="12" fill="#152133">
<text x="14" y="152">Signed lease PDF</text><text x="14" y="168" font-size="11" fill="#5b6576">415 Crescent · Unit 5 · Nov 16</text><text x="230" y="160" text-anchor="end" font-size="11" text-decoration="underline">Bring back</text>
<line x1="14" y1="180" x2="230" y2="180" stroke="#e7e5e0"/>
<text x="14" y="200">Fuel autopay</text><text x="14" y="216" font-size="11" fill="#5b6576">118 Congress · Lower · Nov 15</text><text x="230" y="208" text-anchor="end" font-size="11" text-decoration="underline">Bring back</text>
</g>
<text x="14" y="258" font-size="13" font-weight="600" fill="#152133">Your snoozes</text>
<g font-size="12" fill="#152133">
<text x="14" y="284">CapEx in 2026</text><text x="14" y="300" font-size="11" fill="#5b6576">Until Dec 16</text><text x="230" y="292" text-anchor="end" font-size="11" text-decoration="underline">Bring back</text>
</g>
<text x="14" y="340" font-size="11" fill="#5b6576">Two lines a row: the item over</text>
<text x="14" y="355" font-size="11" fill="#5b6576">its place and date. The tabs</text>
<text x="14" y="370" font-size="11" fill="#5b6576">scroll sideways as they do today.</text>
