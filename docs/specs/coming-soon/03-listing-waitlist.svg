<text x="14" y="84" font-size="10" fill="#5b6576">dana.lee@gmail.com</text>
<text x="14" y="97" font-size="10" fill="#5b6576">(716) 555-0123</text>
<line x1="14" y1="108" x2="186" y2="108" stroke="#e7e5e0"/>
<text x="14" y="126" font-size="11" fill="#152133">Ana</text><text x="186" y="126" font-size="10" fill="#8a93a1" text-anchor="end">Nov 12  ⋯</text>
<text x="14" y="140" font-size="10" fill="#5b6576">ana.r@gmail.com</text>
