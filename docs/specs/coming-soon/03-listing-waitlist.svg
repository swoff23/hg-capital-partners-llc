<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Geist, -apple-system, system-ui, sans-serif">
<title>The property page's Rental listings row with its waiting count, and the listing sheet with the sign-up list, Copy emails and Download</title>
<rect width="900" height="520" fill="#ffffff"/>
<text x="32" y="36" font-size="15" font-weight="600" fill="#152133">Decisions 1, 6, 9 and 10: the listing row and the sign-up list</text>

<g transform="translate(32 56)">
<text x="0" y="12" font-size="11" font-weight="500" fill="#424e61">Property page, Rental listings (laptop and tablet)</text>
<rect x="0" y="22" width="400" height="92" rx="10" fill="#ffffff" stroke="#d5d1ca"/>
