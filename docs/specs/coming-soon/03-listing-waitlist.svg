<rect x="16" y="58" width="40" height="40" rx="6" fill="#efede8"/>
<text x="68" y="74" font-size="12" fill="#152133">Upper</text>
<text x="68" y="92" font-size="11" fill="#5b6576">$1,450/mo · 3 waiting · 2 bd · 1 ba</text>
<text x="300" y="82" font-size="11" font-weight="500" fill="#424e61">Coming soon</text>
<text x="384" y="82" font-size="12" fill="#5b6576">⋯</text>
<text x="0" y="136" font-size="10" fill="#5b6576">Below 480: "Coming soon · 3 waiting · $1,450"; the facts drop first.</text>
<text x="0" y="150" font-size="10" fill="#5b6576">The status column widens from 80 to 96px so "Coming soon" fits on every row.</text>
</g>

<g transform="translate(32 226)">
