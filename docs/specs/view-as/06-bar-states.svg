<text x="1084" y="115.8" font-size="8" font-weight="500" fill="#ffffff" text-anchor="end" text-decoration="underline">Exit</text>
<text x="1060.87" y="115.8" font-size="8" font-weight="400" fill="#c0bdb7" text-anchor="end">View only</text>
<text x="724" y="115.8" font-size="8" font-weight="500" fill="#ffffff">Viewing as Zack Reading</text>
<text x="712" y="151" font-size="11" font-weight="400" fill="#5b6576">No login yet, the longest case</text>
<rect x="712" y="158" width="384" height="22" fill="#152133"/>
<text x="1084" y="171.8" font-size="8" font-weight="500" fill="#ffffff" text-anchor="end" text-decoration="underline">Exit</text>
<text x="1060.87" y="171.8" font-size="8" font-weight="400" fill="#c0bdb7" text-anchor="end">View only</text>
<text x="724" y="171.8" font-size="8" font-weight="500" fill="#ffffff">Viewing as Zack Reading<tspan font-weight="400" fill="#c0bdb7"> · No login yet</tspan></text>
<text x="712" y="207" font-size="11" font-weight="400" fill="#5b6576">A long name</text>
<rect x="712" y="214" width="384" height="22" fill="#152133"/>
<text x="1084" y="227.8" font-size="8" font-weight="500" fill="#ffffff" text-anchor="end" text-decoration="underline">Exit</text>
<text x="1060.87" y="227.8" font-size="8" font-weight="400" fill="#c0bdb7" text-anchor="end">View only</text>
<text x="724" y="227.8" font-size="8" font-weight="500" fill="#ffffff">Viewing as</text>
<rect x="769.72" y="222.92" width="187.78" height="4.16" rx="2.08" fill="#c0bdb7"/>
<text x="1014.87" y="227.8" font-size="8" font-weight="500" fill="#ffffff" text-anchor="end">…<tspan font-weight="400" fill="#c0bdb7"> · Access off</tspan></text>
<text x="1136" y="95" font-size="11" font-weight="400" fill="#5b6576">375, every case</text>
<rect x="1136" y="102" width="281.25" height="33" fill="#152133"/>
<rect x="1377.8" y="102.5" width="33.45" height="32" fill="none" stroke="#c0bdb7" stroke-width="0.75" stroke-dasharray="2 1.5"/>
<text x="1405.25" y="122.7" font-size="12" font-weight="500" fill="#ffffff" text-anchor="end" text-decoration="underline">Exit</text>
<text x="1148" y="122.7" font-size="12" font-weight="500" fill="#ffffff">Viewing as Zack</text>
<text x="1136" y="151" font-size="11" font-weight="400" fill="#5b6576">The same bar for all five cases.</text>
<text x="1136" y="165" font-size="11" font-weight="400" fill="#5b6576">“View only” and the state words drop on a phone</text>
<text x="1136" y="179" font-size="11" font-weight="400" fill="#5b6576">and stay for screen readers.</text>
<text x="1136" y="207" font-size="11" font-weight="400" fill="#5b6576">375, a long first name</text>
<rect x="1136" y="214" width="281.25" height="33" fill="#152133"/>
<text x="1405.25" y="234.7" font-size="12" font-weight="500" fill="#ffffff" text-anchor="end" text-decoration="underline">Exit</text>
<text x="1148" y="234.7" font-size="12" font-weight="500" fill="#ffffff">Viewing as</text>
<rect x="1213.49" y="227.38" width="147.01" height="6.24" rx="3.12" fill="#c0bdb7"/>
<text x="1371.8" y="234.7" font-size="12" font-weight="500" fill="#ffffff" text-anchor="end">…</text>
<text x="1136" y="275" font-size="11" font-weight="400" fill="#5b6576">Drawn at 320 wide, not 375</text>
<rect x="1136" y="282" width="240" height="33" fill="#152133"/>
<text x="1364" y="302.7" font-size="12" font-weight="500" fill="#ffffff" text-anchor="end" text-decoration="underline">Exit</text>
<text x="1148" y="302.7" font-size="12" font-weight="500" fill="#ffffff">Viewing as Zack</text>
<text x="32" y="436" font-size="11" font-weight="400" fill="#5b6576">Dashed box: Exit’s touch target, 44px tall, not drawn in the product. Light bar inside the ink: a long name, as a placeholder.</text>
<text x="32" y="452" font-size="11" font-weight="400" fill="#5b6576">Exit focused: the light outline is keyboard focus, and the faint fill behind Exit is its hover.</text>
<text x="32" y="474" font-size="11" font-weight="400" fill="#5b6576">Scale: 1280 and 768 frames at 0.5, 375 and 320 at 0.75.</text>
</svg>
