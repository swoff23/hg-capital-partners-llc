<text x="656" y="394.28" font-size="6.5" font-weight="500" fill="#ffffff" text-anchor="end" text-decoration="underline">Exit</text>
<text x="635.42" y="394.28" font-size="6.5" font-weight="400" fill="#c0bdb7" text-anchor="end">View only</text>
