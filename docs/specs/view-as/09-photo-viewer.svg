<text x="32" y="1126" font-size="11" font-weight="400" fill="#424e61">The viewer is a full-screen layer over the whole page, ink bar included. Grey bars are the photo's name over who added it and when, the zoom level and the 3 / 8 count.</text>
<text x="32" y="1144" font-size="11" font-weight="400" fill="#424e61">Dashed outlines are notes: the 44px tap targets on touch, and the swipe on a phone. The greyed minus is Zoom out at fit; touch has no arrows or zoom bar.</text>
<text x="32" y="1162" font-size="11" font-weight="400" fill="#5b6576">Frames at a fixed scale: 1280 and 768 at 0.5, 375 at 0.75.</text>
